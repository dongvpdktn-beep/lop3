tnxh:[
["👨‍👩‍👧‍👦🎂","Người Việt có rất nhiều từ xưng hô trong họ hàng: bác, chú, cô, cậu, dì, thím, mợ, dượng… Nhiều thứ tiếng khác chỉ dùng một hai từ cho tất cả.",[["Anh trai của mẹ, em gọi là gì?","Bác (miền Bắc) hoặc cậu",["Chú","Dượng","Ông"],"Anh, em trai của mẹ thuộc họ ngoại."],["Em gái của bố, em gọi là gì?","Cô",["Dì","Mợ","Bác gái"],"Em gái của bố gọi là cô, thuộc họ nội."],["Ngày giỗ là ngày:","Tưởng nhớ người thân đã mất",["Mừng sinh nhật","Mừng năm mới","Khai giảng"],"Ngày giỗ con cháu sum họp tưởng nhớ ông bà, tổ tiên."]]],
["🔥🧯📞","Khói bốc lên cao rất nhanh, vì vậy lính cứu hỏa luôn dặn: cúi thấp người khi thoát khỏi đám cháy.",[["Thứ nào KHÔNG được dùng để dập đám cháy do điện?","Nước",["Bình chữa cháy","Cát khô","Ngắt cầu dao rồi dập"],"Nước dẫn điện, dội vào có thể bị điện giật. Phải ngắt điện trước."],["Em thấy ổ điện bốc khói. Em nên:","Tránh xa và gọi ngay người lớn",["Lấy tay rút phích ra","Dội nước vào","Đứng xem"],"Không tự xử lí, báo người lớn ngắt cầu dao."],["Nhà em nên có sẵn vật gì để phòng cháy?","Bình chữa cháy",["Nhiều nến","Can xăng","Giấy vụn"],"Bình chữa cháy giúp dập đám cháy nhỏ kịp thời."]]],
["🧹🚮🦟","Muỗi vằn truyền bệnh sốt xuất huyết chỉ cần một nắp chai nước đọng là đủ để đẻ trứng.",[["Con vật nào truyền bệnh sốt xuất huyết?","Muỗi vằn",["Ruồi","Kiến","Gián"],"Muỗi vằn đốt người và truyền vi-rút gây bệnh."],["Phát quang bụi rậm quanh nhà để làm gì?","Không cho muỗi, rắn, chuột trú ẩn",["Cho nhà rộng hơn","Để lấy củi","Cho đỡ mát"],"Bụi rậm là nơi ở của muỗi và côn trùng."],["Nước thải sinh hoạt nên:","Chảy vào cống rãnh có nắp đậy",["Đổ ra sân","Đổ ra đường","Để đọng thành vũng"],"Cống rãnh kín giúp nơi ở sạch, không mùi hôi."]]],
null,
["🤝🌳📚","Cây xanh hút khí các-bô-níc và nhả ra khí ô-xi, vì vậy nơi nhiều cây không khí trong lành hơn.",[["Hoạt động “Tết trồng cây” có ý nghĩa gì?","Làm môi trường xanh, sạch, đẹp",["Để lấy gỗ ngay","Để nghỉ học","Để thi chạy"],"Bác Hồ phát động Tết trồng cây từ năm 1960."],["Đi thăm nghĩa trang liệt sĩ, em thể hiện điều gì?","Lòng biết ơn những người đã hi sinh vì đất nước",["Sự tò mò","Sự vui chơi","Không gì cả"],"Uống nước nhớ nguồn."],["Khi tham gia hoạt động cộng đồng, em cần:","Nghe theo hướng dẫn của thầy cô và giữ an toàn",["Tự ý tách đoàn","Chạy nhảy tự do","Làm việc quá sức"],"An toàn và kỉ luật là quan trọng nhất."]]],
["🏫🏅📸","Ngôi trường đầu tiên của nước ta là Quốc Tử Giám ở Hà Nội, lập từ năm 1076.",[["Ngày khai giảng năm học mới thường là ngày nào?","Ngày 5 tháng 9",["Ngày 2 tháng 9","Ngày 20 tháng 11","Ngày 1 tháng 6"],"Ngày 5/9 là Ngày toàn dân đưa trẻ đến trường."],["Để giới thiệu truyền thống trường mình, em có thể:","Làm báo tường, kể chuyện, vẽ tranh về trường",["Giấu không cho ai biết","Nói sai sự thật","Chê trường khác"],"Giới thiệu trung thực và tự hào."],["Ai là người lưu giữ nhiều câu chuyện về trường nhất?","Thầy cô và học sinh cũ",["Người lạ","Khách qua đường","Học sinh mới vào lớp 1"],"Em có thể phỏng vấn thầy cô, cựu học sinh."]]],
["⛑️🧼🚸","Rửa tay với xà phòng đúng cách trong 20 giây có thể loại bỏ phần lớn vi khuẩn trên tay.",[["Giờ ra chơi, trò chơi nào an toàn?","Nhảy dây, đá cầu ở sân",["Trèo lan can","Ném đá","Đu cành cây"],"Chọn trò chơi nhẹ nhàng, đúng nơi."],["Nhà vệ sinh của trường cần được dùng thế nào?","Giữ sạch, xả nước và rửa tay sau khi dùng",["Vẽ lên tường","Vứt giấy bừa bãi","Nghịch nước"],"Giữ vệ sinh chung là trách nhiệm của mỗi học sinh."],["Em thấy bạn ngã chảy máu ở sân trường. Em nên:","Báo ngay thầy cô hoặc đưa bạn đến phòng y tế",["Bỏ đi","Cười bạn","Tự bôi đất vào vết thương"],"Phòng y tế sẽ sơ cứu đúng cách."]]],
null,
["🌾🐄🍵","Việt Nam là một trong những nước xuất khẩu gạo nhiều nhất thế giới. Thái Nguyên nổi tiếng với chè Tân Cương.",[["Nuôi tôm, nuôi cá thuộc hoạt động nào?","Sản xuất nông nghiệp (nuôi trồng thủy sản)",["Sản xuất công nghiệp","Sản xuất thủ công","Dịch vụ du lịch"],"Trồng trọt, chăn nuôi, thủy sản đều là nông nghiệp."],["Con vật nào được nuôi để lấy sức kéo?","Con trâu",["Con gà","Con vịt","Con cá"],"Trâu, bò kéo cày giúp nhà nông."],["Sản phẩm nào làm từ sữa bò?","Sữa chua, phô mai",["Nước mắm","Đậu phụ","Bánh mì"],"Sữa bò chế biến thành nhiều thực phẩm."]]],
["🏭🧵🏺","Làng gốm Bát Tràng ở Hà Nội đã làm gốm hơn 500 năm.",[["Làng nghề Bát Tràng nổi tiếng với sản phẩm gì?","Gốm sứ",["Lụa","Nón lá","Tranh dân gian"],"Bát Tràng là làng gốm cổ bên sông Hồng."],["Làng Vạn Phúc (Hà Nội) nổi tiếng với nghề gì?","Dệt lụa",["Làm gốm","Đúc đồng","Làm nón"],"Lụa Vạn Phúc nổi tiếng từ xưa."],["Điện được sản xuất ở đâu?","Nhà máy điện",["Trang trại","Làng nghề","Siêu thị"],"Nhà máy thủy điện, nhiệt điện sản xuất ra điện."]]],
["🏯⛰️🌊","Vịnh Hạ Long có gần 2 000 hòn đảo lớn nhỏ và được UNESCO công nhận là Di sản thiên nhiên thế giới.",[["Khu di tích ATK Định Hóa nằm ở tỉnh nào?","Thái Nguyên",["Hà Nội","Huế","Quảng Ninh"],"ATK Định Hóa là An toàn khu thời kháng chiến chống Pháp."],["Cố đô Huế là:","Di tích lịch sử – văn hóa",["Cảnh quan thiên nhiên","Nhà máy","Khu chợ"],"Huế từng là kinh đô của triều Nguyễn."],["Đền Hùng (Phú Thọ) thờ ai?","Các Vua Hùng",["Bác Hồ","Thánh Gióng","Hai Bà Trưng"],"Giỗ Tổ Hùng Vương vào ngày 10 tháng 3 âm lịch."]]],
null,
["🌱🌿🌸","Cây tre có thể cao thêm gần 1 mét chỉ trong một ngày, là một trong những loài cây lớn nhanh nhất.",[["Cây nào có thân gỗ?","Cây bàng",["Cây lúa","Cây rau cải","Cây hành"],"Cây thân gỗ có thân cứng, to, sống lâu năm."],["Cây nào có thân thảo (thân mềm)?","Cây rau muống",["Cây xoài","Cây phượng","Cây mít"],"Cây thân thảo có thân mềm, nhỏ."],["Lá cây thường có màu gì?","Xanh lục",["Đỏ","Tím","Đen"],"Lá có chất diệp lục nên có màu xanh."],["Phần nào của lá nối lá với cành?","Cuống lá",["Phiến lá","Gân lá","Rễ"],"Lá gồm cuống lá, phiến lá và gân lá."]]],
["☀️💧🍃","Lá cây giống như một “nhà bếp” tí hon: dùng ánh sáng mặt trời, nước và khí các-bô-níc để tạo ra thức ăn cho cây.",[["Cây cần gì để lá tạo ra chất dinh dưỡng?","Ánh sáng, nước và không khí",["Chỉ cần đất","Bóng tối","Chỉ cần gió"],"Đó là quá trình quang hợp."],["Hạt có chức năng gì?","Mọc thành cây mới",["Hút nước","Nâng đỡ cây","Tạo bóng mát"],"Gieo hạt xuống đất ẩm, hạt nảy mầm thành cây con."]]],
["🐟🐦🐘","Hươu cao cổ là loài thú cao nhất, cổ dài nhưng cũng chỉ có 7 đốt sống cổ, bằng số đốt sống cổ của con người.",[["Lớp phủ bên ngoài cơ thể chim là gì?","Lông vũ",["Vảy","Lông mao","Da trần"],"Chim có lông vũ, thú có lông mao, cá có vảy."],["Con vật nào có lớp vảy bao phủ cơ thể?","Cá chép",["Con mèo","Con gà","Con ếch"],"Vảy giúp bảo vệ cơ thể cá."],["Ếch di chuyển bằng cách nào?","Nhảy và bơi",["Bay","Trườn","Đi bằng hai chân"],"Ếch có chân sau dài, khỏe."]]],
["🥗🌳🚫","Mỗi phút thế giới mất đi diện tích rừng bằng khoảng 27 sân bóng đá.",[["Ăn rau củ đúng mùa có lợi gì?","Tươi ngon, rẻ và an toàn hơn",["Đắt hơn","Không có lợi","Khó mua"],"Rau quả đúng mùa ít phải dùng chất bảo quản."],["Thấy người bán thịt thú rừng quý hiếm, em nên:","Không mua và báo người lớn",["Mua về ăn thử","Rủ bạn mua","Mặc kệ"],"Buôn bán động vật hoang dã quý hiếm là vi phạm pháp luật."]]],
null,
["🦷🍚➡️","Ruột non của người lớn dài khoảng 6 mét, gấp mấy lần chiều cao cơ thể.",[["Thức ăn đi từ miệng xuống dạ dày qua bộ phận nào?","Thực quản",["Ruột già","Khí quản","Ruột non"],"Thực quản là ống nối họng với dạ dày."],["Bộ phận nào hấp thụ nước và tạo thành phân?","Ruột già",["Miệng","Dạ dày","Thực quản"],"Chất bã được đưa xuống ruột già rồi thải ra ngoài."],["Tuyến nước bọt nằm ở đâu?","Trong khoang miệng",["Trong dạ dày","Trong ruột già","Trong tim"],"Nước bọt làm mềm thức ăn."]]],
["🥦🚰🪥","Nhai kĩ giúp dạ dày đỡ vất vả: thức ăn càng được nghiền nhỏ thì càng dễ tiêu hóa.",[["Nên uống đủ nước mỗi ngày để:","Tiêu hóa tốt, không bị táo bón",["Ngủ nhiều hơn","Ăn ít đi","Đỡ phải rửa tay"],"Nước và chất xơ giúp tiêu hóa dễ dàng."],["Thức ăn nào giàu chất xơ, tốt cho tiêu hóa?","Rau xanh và trái cây",["Kẹo","Nước ngọt có ga","Khoai tây chiên"],"Chất xơ giúp ruột hoạt động tốt."],["Vì sao không nên ăn quá no vào buổi tối?","Dạ dày phải làm việc nhiều, khó ngủ",["Vì sẽ đói nhanh","Vì cơm tối không ngon","Vì tốn bát"],"Ăn vừa đủ, đúng giờ."]]],
["❤️🩸💪","Trái tim của em to khoảng bằng nắm tay em và đập khoảng 100 000 lần mỗi ngày.",[["Tim nằm ở đâu trong cơ thể?","Trong lồng ngực, hơi lệch về bên trái",["Trong bụng","Trong đầu","Ở cánh tay"],"Đặt tay lên ngực trái sẽ thấy tim đập."],["Sau khi chạy nhanh, nhịp tim của em sẽ:","Đập nhanh hơn",["Đập chậm hơn","Ngừng đập","Không đổi"],"Cơ thể cần nhiều ô-xi hơn nên tim đập nhanh."],["Máu được vận chuyển đi khắp cơ thể qua:","Các mạch máu",["Dây thần kinh","Ống tiêu hóa","Xương"],"Mạch máu như những đường ống dẫn máu."]]],
["🏃🥗😊","Cười nhiều cũng tốt cho tim: khi vui vẻ, mạch máu giãn ra và máu lưu thông dễ hơn.",[["Thức ăn nào nên hạn chế để bảo vệ tim mạch?","Đồ ăn nhiều muối, nhiều mỡ",["Rau xanh","Cá","Trái cây"],"Ăn mặn và nhiều mỡ không tốt cho tim mạch."],["Môn nào tốt cho tim mạch của học sinh?","Bơi, đạp xe, chạy bộ vừa sức",["Ngồi chơi điện tử","Nằm xem ti vi","Thức khuya"],"Vận động đều đặn làm tim khỏe."]]],
["🧠⚡👀","Não chỉ nặng khoảng 2% cơ thể nhưng dùng tới khoảng 20% năng lượng của cơ thể.",[["Bộ phận nào điều khiển mọi suy nghĩ và hoạt động của cơ thể?","Não",["Tim","Dạ dày","Phổi"],"Não là trung tâm điều khiển."],["Dây thần kinh có nhiệm vụ gì?","Dẫn truyền thông tin giữa não, tủy sống và các bộ phận",["Bơm máu","Tiêu hóa thức ăn","Nâng đỡ cơ thể"],"Dây thần kinh như đường dây điện thoại của cơ thể."],["Chạm tay vào vật nóng, em rụt tay lại ngay. Đó là nhờ:","Cơ quan thần kinh",["Cơ quan tiêu hóa","Cơ quan tuần hoàn","Mái tóc"],"Đây là phản xạ, do tủy sống điều khiển."]]],
["😴📵🎵","Khi em ngủ, não vẫn làm việc: nó sắp xếp lại những điều em học trong ngày để nhớ lâu hơn.",[["Học sinh lớp 3 nên ngủ khoảng bao nhiêu giờ mỗi ngày?","9 đến 11 giờ",["4 đến 5 giờ","6 giờ","2 đến 3 giờ"],"Trẻ em cần ngủ nhiều hơn người lớn."],["Việc nào giúp thư giãn đầu óc?","Nghe nhạc nhẹ, đọc truyện, chơi ngoài trời",["Xem phim kinh dị","Chơi điện tử đến khuya","Cãi nhau"],"Giải trí lành mạnh giúp não nghỉ ngơi."]]],
["🚭🍺❌","Một điếu thuốc lá chứa hàng nghìn chất hóa học, trong đó có nhiều chất gây ung thư.",[["Ma túy có hại thế nào?","Gây nghiện, hủy hoại sức khỏe và cuộc sống",["Giúp học giỏi","Giúp khỏe hơn","Không có hại"],"Tuyệt đối tránh xa ma túy."],["Nước ngọt có ga, nước tăng lực với trẻ em thì:","Nên hạn chế vì nhiều đường và chất kích thích",["Uống càng nhiều càng tốt","Thay được nước lọc","Giúp ngủ ngon"],"Nước lọc và sữa tốt hơn cho trẻ em."]]],
null,
["🧭🌅🌇","La bàn có kim nam châm luôn chỉ hướng Bắc – Nam, giúp người đi biển, đi rừng không bị lạc.",[["Dụng cụ nào dùng để xác định phương hướng?","La bàn",["Nhiệt kế","Cân","Thước dây"],"Kim la bàn luôn chỉ hướng Bắc – Nam."],["Buổi chiều, Mặt Trời ở phía nào?","Phía Tây",["Phía Đông","Phía Bắc","Phía Nam"],"Mặt Trời mọc ở Đông, lặn ở Tây."],["Trên bản đồ, phía trên thường là phương nào?","Phương Bắc",["Phương Nam","Phương Đông","Phương Tây"],"Quy ước bản đồ: trên Bắc, dưới Nam, phải Đông, trái Tây."]]],
["🌍🌡️❄️","Nơi lạnh nhất Trái Đất là Nam Cực, có lúc xuống tới gần âm 90 độ C.",[["Việt Nam nằm trong đới khí hậu nào?","Nhiệt đới (đới nóng)",["Hàn đới","Ôn đới","Vùng cực"],"Nước ta nóng ẩm, mưa nhiều."],["Đới ôn hòa có đặc điểm gì?","Có bốn mùa rõ rệt",["Nóng quanh năm","Lạnh quanh năm","Không có mưa"],"Xuân, hạ, thu, đông thay đổi rõ."],["Trái Đất có dạng hình gì?","Hình cầu",["Hình vuông","Hình tam giác","Hình hộp"],"Quả địa cầu là mô hình của Trái Đất."]]],
["🏔️🏞️🌊","Đỉnh núi cao nhất Việt Nam là Phan-xi-păng, cao 3 143 mét. Đại dương rộng nhất là Thái Bình Dương.",[["Trái Đất có mấy châu lục?","6 châu lục",["4 châu lục","5 châu lục","8 châu lục"],"Châu Á, Âu, Phi, Mĩ, Đại Dương và Nam Cực."],["Trái Đất có mấy đại dương?","4 đại dương",["2 đại dương","3 đại dương","7 đại dương"],"Sách lớp 3: Thái Bình Dương, Đại Tây Dương, Ấn Độ Dương, Bắc Băng Dương."],["Đại dương nào rộng nhất?","Thái Bình Dương",["Ấn Độ Dương","Đại Tây Dương","Bắc Băng Dương"],"Thái Bình Dương rộng nhất."],["Nơi cao, có đỉnh nhọn, sườn dốc là:","Núi",["Đồng bằng","Hồ","Biển"],"Đồi thấp hơn, đỉnh tròn, sườn thoải."]]],
["☀️🌍🌙","Ánh sáng đi từ Mặt Trời đến Trái Đất mất khoảng 8 phút. Mặt Trăng không tự phát sáng mà phản chiếu ánh sáng Mặt Trời.",[["Mặt Trời là:","Một ngôi sao tự phát sáng và tỏa nhiệt",["Một hành tinh","Một vệ tinh","Một đám mây"],"Mặt Trời chiếu sáng và sưởi ấm Trái Đất."],["Vì sao ta thấy Mặt Trăng sáng?","Vì nó phản chiếu ánh sáng Mặt Trời",["Vì nó tự phát sáng","Vì có đèn","Vì có lửa"],"Mặt Trăng không tự phát sáng."],["Vì sao có ngày và đêm?","Vì Trái Đất tự quay quanh mình nó",["Vì Mặt Trời tắt đi","Vì mây che","Vì Mặt Trăng che"],"Nửa được chiếu sáng là ngày, nửa kia là đêm."]]],

dd:[
["🇻🇳🎵","Quốc kì Việt Nam nền đỏ, ngôi sao vàng năm cánh. Quốc ca là bài “Tiến quân ca” của nhạc sĩ Văn Cao.",[["Quốc kì Việt Nam có đặc điểm gì?","Nền đỏ, ở giữa có ngôi sao vàng năm cánh",["Nền xanh, sao trắng","Nền vàng, sao đỏ","Nền trắng, chấm đỏ"],"Lá cờ đỏ sao vàng."],["Khi chào cờ, mắt em hướng về đâu?","Lá Quốc kì",["Xuống đất","Sang bạn bên cạnh","Ra cổng trường"],"Đứng nghiêm, mắt nhìn Quốc kì."]]],
["🗺️🏞️🥢","Nước Việt Nam có hình chữ S, có 54 dân tộc anh em cùng chung sống.",[["Đất nước Việt Nam có hình dạng giống chữ gì?","Chữ S",["Chữ C","Chữ O","Chữ L"],"Dải đất hình chữ S bên bờ Biển Đông."],["Việt Nam có bao nhiêu dân tộc?","54 dân tộc",["10 dân tộc","36 dân tộc","100 dân tộc"],"54 dân tộc anh em."],["Trang phục truyền thống của phụ nữ Việt Nam là:","Áo dài",["Ki-mô-nô","Váy xòe","Áo vét"],"Áo dài là nét đẹp văn hóa Việt Nam."]]],
["🏘️🤝🍲","Ông bà ta dạy: “Hàng xóm tối lửa tắt đèn có nhau”, nghĩa là lúc khó khăn hàng xóm là người giúp mình đầu tiên.",[["Hàng xóm đi vắng nhờ trông nhà giúp, gia đình em nên:","Vui vẻ để ý giúp",["Từ chối ngay","Vào nhà lục đồ","Mặc kệ"],"Giúp đỡ nhau khi cần."],["Buổi trưa, hàng xóm đang nghỉ, em nên:","Chơi nhẹ nhàng, không làm ồn",["Bật nhạc thật to","Đá bóng vào cổng","Hò hét"],"Tôn trọng giờ nghỉ của mọi người."],["Gặp bác hàng xóm, em nên:","Chào hỏi lễ phép",["Quay mặt đi","Chạy trốn","Nói trống không"],"Lời chào cao hơn mâm cỗ."]]],
["📚❓💡","Nhà bác học Ê-đi-xơn đã thử hàng nghìn lần mới làm ra bóng đèn điện. Ông luôn tò mò và ham học hỏi.",[["Đọc sách thấy từ chưa hiểu, em nên:","Tra từ điển hoặc hỏi người lớn",["Bỏ qua","Gấp sách lại","Đoán bừa"],"Chủ động tìm hiểu điều chưa biết."],["Ham học hỏi giúp em:","Hiểu biết nhiều hơn và tiến bộ",["Mệt hơn","Mất bạn","Bị chê"],"Càng học càng giỏi."],["Câu nào nói về tinh thần ham học?","Học, học nữa, học mãi",["Ăn quả nhớ kẻ trồng cây","Lá lành đùm lá rách","Một con ngựa đau cả tàu bỏ cỏ"],"Lời dạy của Lê-nin về việc học suốt đời."],["Bạn làm bài tốt hơn em. Em nên:","Hỏi bạn cách làm để học theo",["Ghen tị","Nói xấu bạn","Chép bài bạn"],"Học thầy không tày học bạn."]]],
["🤞✅⏰","“Một lần bất tín, vạn lần bất tin”: chỉ cần thất hứa một lần, người khác sẽ khó tin mình lần sau.",[["Trước khi hứa điều gì, em nên:","Suy nghĩ xem mình có làm được không",["Hứa ngay cho vui","Hứa thật nhiều","Hứa rồi tính sau"],"Chỉ hứa điều mình làm được."],["Em hứa trả sách cho bạn hôm nay nhưng để quên ở nhà. Em nên:","Xin lỗi bạn và mang trả vào ngày mai",["Nói là đã trả rồi","Trốn bạn","Trách bạn đòi"],"Thành thật và sửa sai."],["Người biết giữ lời hứa sẽ được mọi người:","Tin cậy và quý mến",["Xa lánh","Chê cười","Ghen ghét"],"Chữ tín rất quý."]]],
["📋💪⭐","Việc hôm nay chớ để ngày mai: làm ngay việc được giao giúp em không bị dồn việc.",[["Được giao làm tổ trưởng, em nên:","Nhắc các bạn và gương mẫu làm trước",["Bắt bạn làm hết","Bỏ mặc tổ","Chỉ lo việc mình"],"Người có trách nhiệm luôn gương mẫu."],["Gặp nhiệm vụ khó, em nên:","Cố gắng, cần thì nhờ thầy cô, bạn bè hướng dẫn",["Bỏ cuộc","Nhờ người làm hộ hết","Giả vờ ốm"],"Không ngại khó."],["Bố mẹ giao em trông em bé 10 phút. Em nên:","Ở bên em, không bỏ đi chơi",["Chạy ra ngõ chơi","Mải xem ti vi","Để em một mình"],"Làm đúng việc được giao."]]],
["🪞🌟🎨","Không ai giống ai hoàn toàn: ngay cả dấu vân tay của mỗi người cũng khác nhau.",[["Điểm yếu của bản thân là:","Những điều mình làm chưa tốt, cần cố gắng",["Điều mình giỏi nhất","Món đồ mình thích","Bạn thân của mình"],"Biết điểm yếu để khắc phục."],["Biết mình hay quên, em nên:","Ghi việc cần làm vào sổ nhắc",["Kệ","Đổ tại người khác","Giấu đi"],"Tìm cách khắc phục điểm yếu."],["Bạn góp ý em hay nói chuyện riêng trong giờ. Em nên:","Cảm ơn bạn và sửa",["Giận bạn","Cãi lại","Nói xấu bạn"],"Lời góp ý giúp mình tiến bộ."]]],
["🫱🫲💬","Hít thở sâu và đếm chậm từ 1 đến 10 giúp em bình tĩnh lại khi đang giận.",[["Khi đang rất giận bạn, việc đầu tiên nên làm là:","Hít thở sâu để bình tĩnh lại",["Hét lên","Đánh bạn","Ném đồ"],"Bình tĩnh rồi mới nói chuyện."],["Hai bạn giận nhau vì hiểu lầm. Cách tốt nhất là:","Nói chuyện thẳng thắn để hiểu nhau",["Không nhìn mặt nhau","Rủ bạn khác tẩy chay","Viết giấy nói xấu"],"Trao đổi giúp hết hiểu lầm."],["Bạn xin lỗi em chân thành. Em nên:","Tha thứ và tiếp tục chơi với bạn",["Không bao giờ tha","Bắt bạn đền","Kể tội bạn với cả lớp"],"Biết tha thứ là đức tính tốt."]]],
["🚶🚦🦓","Vạch kẻ đường cho người đi bộ có sọc trắng trông giống lưng ngựa vằn nên còn được gọi là “vạch ngựa vằn”.",[["Người đi bộ đi ở đâu là đúng?","Trên vỉa hè, lề đường",["Giữa lòng đường","Trên dải phân cách","Trên đường ray"],"Vỉa hè dành cho người đi bộ."],["Đèn tín hiệu cho người đi bộ có hình người màu xanh nghĩa là:","Được phép qua đường",["Phải dừng lại","Chạy thật nhanh","Đi lùi"],"Hình người màu đỏ: dừng; màu xanh: đi."],["Đi bộ buổi tối, em nên mặc quần áo:","Sáng màu để xe dễ nhìn thấy",["Màu đen","Tối màu","Màu nào cũng được"],"Áo sáng màu giúp người lái xe nhìn thấy em."]]],
["🪖🚌🛶","Đội mũ bảo hiểm đúng cách giúp giảm rất nhiều nguy cơ chấn thương đầu khi gặp tai nạn.",[["Đội mũ bảo hiểm đúng cách là:","Đội ngay ngắn, cài quai vừa khít cằm",["Đội mà không cài quai","Đội lệch ra sau","Cầm ở tay"],"Phải cài quai mũ mới an toàn."],["Ngồi sau xe máy, em cần:","Bám chắc vào người lái, không đùa nghịch",["Đứng lên yên","Dang hai tay","Quay ngược lại"],"Ngồi ngay ngắn, bám chắc."],["Khi đi xe đạp, em nên đi ở đâu?","Sát lề đường bên phải",["Giữa lòng đường","Bên trái đường","Trên vỉa hè đông người"],"Đi bên phải, sát lề, không dàn hàng ngang."]]]],
tin:[
["📰👂✅","Mỗi ngày em nhận hàng nghìn thông tin qua mắt và tai, và não chọn ra thông tin cần để quyết định.",[["Thấy trời nhiều mây đen, em mang ô. “Trời nhiều mây đen” là:","Thông tin",["Quyết định","Thiết bị","Phần mềm"],"Thông tin giúp em quyết định mang ô."],["Xem thời khóa biểu rồi soạn sách vở. “Soạn sách vở” là:","Quyết định",["Thông tin","Tiếng trống","Thời khóa biểu"],"Thời khóa biểu là thông tin."],["Thông tin có thể ở dạng nào?","Chữ, hình ảnh, âm thanh",["Chỉ có chữ","Chỉ có hình","Chỉ có số"],"Ba dạng thông tin thường gặp."]]],
["🧠⚙️➡️","Máy tính có “bộ não” gọi là bộ xử lí (CPU), có thể làm hàng tỉ phép tính mỗi giây.",[["Sơ đồ xử lí thông tin gồm:","Thông tin vào → Xử lí → Thông tin ra",["Ra → Vào → Xử lí","Xử lí → Vào → Ra","Chỉ có thông tin ra"],"Tiếp nhận, xử lí rồi đưa ra kết quả."],["Em nghe cô đọc phép tính rồi nói kết quả. “Nghe cô đọc” là:","Tiếp nhận thông tin vào",["Kết quả xử lí","Thông tin ra","Thiết bị"],"Tai tiếp nhận thông tin."],["Máy giặt nhận lệnh rồi tự giặt, vắt. Đó là ví dụ về:","Máy xử lí thông tin",["Con người xử lí","Trò chơi","Thời tiết"],"Nhiều thiết bị cũng tiếp nhận và xử lí thông tin."]]],
["🖥️💻📱","Chiếc máy tính điện tử đầu tiên to bằng cả một căn phòng lớn và nặng khoảng 30 tấn.",[["Bộ phận nào dùng để gõ chữ vào máy tính?","Bàn phím",["Màn hình","Loa","Thân máy"],"Bàn phím là thiết bị vào."],["Bộ phận nào phát ra âm thanh?","Loa",["Chuột","Bàn phím","Màn hình"],"Loa là thiết bị ra."],["“Bộ não” của máy tính nằm ở đâu?","Trong thân máy",["Trong chuột","Trong bàn phím","Trong loa"],"Thân máy chứa bộ xử lí."]]],
["🪑👀⏱️","Quy tắc 20-20-20: cứ 20 phút nhìn màn hình, nhìn xa 20 feet (khoảng 6 mét) trong 20 giây để mắt nghỉ.",[["Tư thế ngồi máy tính đúng là:","Lưng thẳng, mắt cách màn hình 50–80 cm",["Cúi sát màn hình","Nằm ra bàn","Ngồi vẹo một bên"],"Ngồi đúng để bảo vệ mắt và cột sống."],["Khi máy tính đang chạy, em KHÔNG nên:","Chạm vào dây điện, ổ cắm",["Dùng chuột","Gõ phím","Nhìn màn hình"],"An toàn điện là trên hết."],["Dùng máy xong, em cần:","Tắt máy đúng cách",["Rút phích điện ngay","Để máy chạy cả đêm","Đập mạnh bàn phím"],"Tắt máy bằng lệnh Shut down."]]],
["⌨️🖐️🔤","Hai phím F và J có gờ nổi để em đặt đúng hai ngón trỏ mà không cần nhìn bàn phím.",[["Hàng phím cơ sở gồm các phím nào?","A S D F G H J K L",["Q W E R T Y","Z X C V B N M","1 2 3 4 5"],"Hàng phím cơ sở là nơi đặt các ngón tay."],["Phím dài nhất trên bàn phím là:","Phím cách (Space)",["Enter","Shift","Caps Lock"],"Dùng ngón cái để gõ phím cách."],["Hai phím nào có gờ nổi?","F và J",["A và L","G và H","D và K"],"Đặt hai ngón trỏ lên F và J."]]],
["🌐🔎🛡️","Internet nối hàng tỉ máy tính trên khắp thế giới lại với nhau.",[["Muốn xem dự báo thời tiết trên Internet, em nên:","Vào trang web tin cậy cùng người lớn",["Bấm vào quảng cáo","Hỏi người lạ","Tải phần mềm lạ"],"Chọn nguồn đáng tin."],["Trò chơi trên mạng bắt nhập số điện thoại của bố mẹ. Em nên:","Không nhập và hỏi bố mẹ",["Nhập ngay","Nhập số của ông bà","Hỏi bạn"],"Không tự ý cung cấp thông tin."]]],
["🗂️📚🔍","Thư viện lớn có hàng triệu cuốn sách nhưng vẫn tìm được ngay nhờ sách được xếp theo mã số.",[["Tủ quần áo xếp riêng áo, quần, tất giúp em:","Tìm đồ nhanh hơn",["Tốn chỗ hơn","Khó tìm hơn","Mất thời gian"],"Phân loại rồi sắp xếp."],["Danh sách lớp thường được xếp theo:","Thứ tự bảng chữ cái của tên",["Chiều cao","Màu áo","Ngẫu nhiên"],"Xếp theo a, b, c để dễ tìm tên."],["Trong từ điển, các từ được sắp xếp theo:","Thứ tự bảng chữ cái",["Độ dài của từ","Ngẫu nhiên","Số trang"],"Nhờ vậy tra từ rất nhanh."]]],
["🌳📁📄","Thư mục trong máy tính giống như ngăn kéo: trong ngăn lớn có thể có nhiều ngăn nhỏ.",[["Trong sơ đồ hình cây, thư mục nằm bên trong thư mục khác gọi là:","Thư mục con",["Thư mục gốc","Tệp","Ổ đĩa"],"Thư mục mẹ chứa thư mục con."],["Tệp (file) dùng để:","Lưu thông tin như bài viết, hình ảnh, bài hát",["Chứa thư mục","Sạc pin","Kết nối mạng"],"Mỗi tệp có một tên."],["Ổ đĩa trong máy tính thường có tên như:","C:, D:",["Folder","Recycle Bin","Enter"],"Ổ đĩa chứa các thư mục và tệp."]]],
["🖱️📂✏️","Tên tệp thường có phần đuôi cho biết loại tệp, ví dụ .docx là văn bản, .jpg là ảnh.",[["Để đổi tên thư mục, em nháy nút phải chuột rồi chọn:","Rename",["Delete","New","Open"],"Rename nghĩa là đổi tên."],["Để xóa thư mục, em nháy nút phải chuột rồi chọn:","Delete",["Rename","Copy","New"],"Delete nghĩa là xóa. Cần cẩn thận khi xóa."],["Muốn mở một thư mục, em:","Nháy đúp chuột vào thư mục đó",["Nháy nút phải rồi chọn Delete","Kéo ra ngoài màn hình","Tắt máy"],"Nháy đúp để mở."]]],
["🔒👤🚫","Mật khẩu mạnh nên dài, có cả chữ và số, và không phải là ngày sinh hay tên của em.",[["Mật khẩu nào an toàn hơn?","Meo7Xanh2Cay",["123456","matkhau","tên của em"],"Mật khẩu dài, có chữ hoa, chữ thường và số thì khó đoán."],["Bạn thân hỏi mật khẩu của em. Em nên:","Không cho, chỉ bố mẹ được biết",["Cho ngay","Viết lên bảng","Đăng lên mạng"],"Mật khẩu là bí mật."],["Người lạ trên mạng muốn gặp em. Em nên:","Từ chối và báo bố mẹ",["Đồng ý đi một mình","Giấu bố mẹ","Cho địa chỉ nhà"],"Không gặp người lạ quen qua mạng."]]],
["📽️🖼️🔠","Một trang chiếu hay thường chỉ có vài dòng chữ to và một hình ảnh đẹp.",[["Trang chiếu đầu tiên thường ghi gì?","Tên bài trình chiếu và tên người trình bày",["Lời cảm ơn","Câu hỏi","Không ghi gì"],"Đó là trang tiêu đề."],["Để thêm trang chiếu mới trong PowerPoint, em chọn:","New Slide",["Delete","Save","Close"],"New Slide: trang chiếu mới."],["Muốn lưu bài trình chiếu, em chọn lệnh:","Save",["Exit","New","Print"],"Save (hoặc Ctrl + S) để lưu bài."]]],
["🦁🌌🎞️","Nhờ máy tính và video, em có thể “thăm” đáy biển sâu hay sao Hỏa mà không cần rời khỏi nhà.",[["Xem video về các loài cá trên máy tính giúp em:","Quan sát được nơi em không đến được",["Bắt được cá","Nuôi cá","Bơi giỏi hơn"],"Máy tính mở rộng tầm hiểu biết."],["Khi tìm hiểu thế giới tự nhiên bằng máy tính, em nên:","Ghi chép lại điều mới học được",["Chỉ xem cho vui rồi quên","Xem thật lâu","Tắt tiếng"],"Ghi chép giúp nhớ lâu."]]],
["🖱️👆🎯","Chuột máy tính có tên như vậy vì chiếc đầu tiên nhỏ, có dây dài trông giống con chuột.",[["Nháy đúp chuột là:","Nhấn nhanh hai lần liên tiếp nút trái",["Nhấn một lần nút phải","Giữ nút trái thật lâu","Lăn nút cuộn"],"Nháy đúp thường dùng để mở."],["Cầm chuột đúng cách: ngón trỏ đặt ở:","Nút trái chuột",["Nút phải chuột","Dây chuột","Mặt dưới chuột"],"Ngón trỏ nút trái, ngón giữa nút phải."]]],
["🪜1️⃣2️⃣","Máy tính làm việc theo từng bước rất chính xác: chỉ cần sai thứ tự một bước, kết quả sẽ sai.",[["Thứ tự đánh răng đúng là:","Lấy kem → chải răng → súc miệng",["Súc miệng → lấy kem → chải răng","Chải răng → lấy kem → súc miệng","Súc miệng → chải răng → lấy kem"],"Việc nào cũng có thứ tự các bước."],["Để pha cốc nước chanh, bước đầu tiên là:","Chuẩn bị chanh, đường, nước, cốc",["Uống","Khuấy đều","Rửa cốc sau khi uống"],"Chuẩn bị trước rồi mới làm."]]],
["❓➡️✅","Câu lệnh “Nếu… thì…” là một trong những câu lệnh quan trọng nhất khi lập trình cho máy tính.",[["“Nếu được điểm 10 thì mẹ thưởng.” Việc “mẹ thưởng” xảy ra khi:","Em được điểm 10",["Em được điểm 5","Lúc nào cũng có","Không bao giờ"],"Điều kiện đúng thì việc được thực hiện."],["“Nếu trời tối thì bật đèn.” Trời đang sáng. Vậy:","Chưa cần bật đèn",["Bật đèn","Tắt quạt","Đi ngủ"],"Điều kiện chưa xảy ra."]]],
["🤖🧮🖨️","Máy tính tính rất nhanh nhưng không tự nghĩ ra việc cần làm: con người phải chỉ cho nó từng bước.",[["Việc nào máy tính làm nhanh hơn con người?","Tính toán với các số rất lớn",["Thương yêu bạn bè","Tự rèn tính kiên trì","Cảm nhận mùi hoa"],"Máy tính tính nhanh và chính xác."],["Muốn nhờ máy tính giúp, em phải:","Chia việc thành các bước rõ ràng",["Nói chung chung","Để máy tự đoán","Không cần làm gì"],"Máy chỉ làm theo chỉ dẫn rõ ràng."]]]],
cn:[
["🌳🔧📱","Bánh xe là một trong những phát minh quan trọng nhất của loài người, ra đời hơn 5 000 năm trước.",[["Đâu là đối tượng tự nhiên?","Dòng sông",["Cây cầu","Xe đạp","Điện thoại"],"Tự nhiên là những gì không do con người làm ra."],["Đâu là sản phẩm công nghệ?","Tủ lạnh",["Mặt Trăng","Ngọn núi","Con chim"],"Sản phẩm công nghệ do con người làm ra."],["Sản phẩm công nghệ được làm ra để:","Phục vụ đời sống con người",["Trang trí bầu trời","Thay thế thiên nhiên","Không để làm gì"],"Giúp cuộc sống tiện lợi hơn."]]],
["💡📖👓","Đèn LED tiết kiệm điện hơn nhiều so với bóng đèn sợi đốt và ít nóng hơn.",[["Khi học, nên đặt đèn học ở phía nào (với người thuận tay phải)?","Bên trái",["Bên phải","Sau lưng","Dưới gầm bàn"],"Đặt bên trái để tay viết không che ánh sáng."],["Ánh sáng đèn học nên:","Vừa đủ, không quá chói",["Thật chói","Thật tối","Nhấp nháy"],"Ánh sáng vừa đủ để bảo vệ mắt."]]],
["🌀🔌💨","Quạt điện không làm không khí lạnh đi, nó tạo ra gió giúp mồ hôi bay hơi nên ta thấy mát.",[["Bộ phận nào của quạt tạo ra gió?","Cánh quạt",["Đế quạt","Dây nguồn","Lồng quạt"],"Cánh quạt quay tạo ra gió."],["Lồng quạt có tác dụng gì?","Bảo vệ, không cho tay chạm vào cánh quạt",["Tạo ra gió","Dẫn điện","Điều chỉnh tốc độ"],"Lồng quạt giữ an toàn."],["Khi quạt đang chạy, em KHÔNG được:","Cho ngón tay hoặc que vào lồng quạt",["Ngồi cách xa","Bấm nút chọn tốc độ","Tắt quạt"],"Rất nguy hiểm."]]],
["📻🎙️🔊","Đài Tiếng nói Việt Nam phát chương trình đầu tiên vào ngày 7 tháng 9 năm 1945.",[["Máy thu thanh dùng để:","Nghe các chương trình phát thanh",["Xem phim","Chụp ảnh","Giặt quần áo"],"Máy thu thanh chỉ phát âm thanh."],["Núm (nút) nào dùng để chỉnh tiếng to, nhỏ?","Núm âm lượng",["Núm dò kênh","Ăng-ten","Tay cầm"],"Âm lượng: độ to nhỏ của tiếng."]]],
["📺🎬🛋️","Đài Truyền hình Việt Nam (VTV) phát sóng buổi đầu tiên vào ngày 7 tháng 9 năm 1970.",[["Đài Truyền hình Việt Nam viết tắt là:","VTV",["VOV","VNA","TTX"],"VTV: Đài Truyền hình Việt Nam."],["Kênh truyền hình nào dành cho thiếu nhi?","VTV7 và các chương trình thiếu nhi",["Kênh chứng khoán","Kênh quảng cáo","Kênh thời sự đêm khuya"],"VTV7 là kênh giáo dục."],["Mỗi ngày em nên xem ti vi:","Vừa phải, không quá lâu",["Cả ngày","Đến nửa đêm","Vừa ăn vừa xem suốt"],"Xem nhiều hại mắt và mất thời gian học."]]],
["⚠️🔌🔥","Hầu hết tai nạn của trẻ em xảy ra ngay trong nhà, vì vậy biết cách phòng tránh là rất quan trọng.",[["Tay ướt có được chạm vào công tắc, ổ điện không?","Không, vì dễ bị điện giật",["Có, bình thường","Có, nếu nhanh","Có, nếu đi dép"],"Nước dẫn điện."],["Ngửi thấy mùi gas trong bếp, em cần:","Không bật lửa, không bật điện, mở cửa và báo người lớn",["Bật bếp thử","Bật quạt điện","Đóng kín cửa"],"Tia lửa có thể gây cháy nổ."],["Số điện thoại gọi cấp cứu y tế là:","115",["113","114","111"],"115: cấp cứu; 114: cứu hỏa; 113: công an; 111: bảo vệ trẻ em."]]],
["✂️📏🧴","Giấy được người Trung Quốc phát minh cách đây khoảng 2 000 năm.",[["Hồ dán dùng để:","Dán các chi tiết lại với nhau",["Cắt giấy","Đo độ dài","Vẽ đường tròn"],"Hồ dán, keo, băng dính đều để dán."],["Vật liệu nào dễ cắt, gấp nhất?","Giấy thủ công",["Gỗ","Sắt","Thủy tinh"],"Giấy mỏng, dễ tạo hình."]]],
["📐✏️🖍️","Chiếc thước kẻ tự làm vẫn đo được chính xác nếu em chia vạch thật cẩn thận.",[["Làm thước kẻ bằng bìa, điều quan trọng nhất là:","Chia các vạch xăng-ti-mét đều và chính xác",["Tô thật nhiều màu","Cắt thật to","Dán nhiều hình"],"Thước phải đo đúng."],["Trước khi cắt, em cần:","Đo và vẽ đường cắt bằng bút chì",["Cắt luôn không cần vẽ","Dán trước","Tô màu trước"],"Đo, vẽ rồi mới cắt."],["Yêu cầu của một sản phẩm thủ công tốt là:","Đúng kích thước, chắc chắn, đẹp",["Làm thật nhanh","Dùng thật nhiều keo","Thật to"],"Đúng, chắc, đẹp."]]],
["🚸⛔🔺","Biển báo dùng hình dạng và màu sắc để người đi đường hiểu ngay mà không cần đọc chữ.",[["Biển báo hình tam giác, viền đỏ, nền vàng là:","Biển báo nguy hiểm",["Biển cấm","Biển hiệu lệnh","Biển chỉ dẫn"],"Cảnh báo điều nguy hiểm phía trước."],["Biển báo có các phần nào?","Biển, cột và đế",["Chỉ có biển","Bánh xe và tay lái","Cánh và đuôi"],"Mô hình biển báo gồm biển, cột, đế."]]],
["🪁🚗🧸","Trẻ em Việt Nam xưa tự làm đồ chơi từ lá dừa, tre, đất nặn: chong chóng, diều, tò he…",[["Bộ phận nào giúp xe đồ chơi lăn được?","Bánh xe và trục bánh xe",["Thân xe","Mui xe","Cửa xe"],"Bánh xe quay quanh trục."],["Làm xe đồ chơi, bánh xe cần:","Tròn đều và quay được quanh trục",["Hình vuông","Dán chặt vào thân","Thật nặng"],"Bánh tròn mới lăn tốt."]]]],
an:[
["🥁🦁🏮","Trống đồng Đông Sơn của người Việt cổ đã hơn 2 000 năm tuổi.",[["Nốt nhạc nào thấp nhất trong 7 nốt cơ bản?","Đô",["Rê","Son","Si"],"Thứ tự: Đô, Rê, Mi, Pha, Son, La, Si."],["Múa lân còn được gọi là:","Múa sư tử",["Múa quạt","Múa sạp","Múa rối"],"Múa lân – sư – rồng vui dịp Trung thu, Tết."]]],
["🇻🇳🎶🎤","Nhạc sĩ Văn Cao viết bài Tiến quân ca vào năm 1944.",[["Bài Quốc ca được hát trong dịp nào?","Lễ chào cờ",["Giờ ra chơi","Lúc đi ngủ","Khi ăn cơm"],"Hát Quốc ca trong lễ chào cờ và các buổi lễ lớn."],["Nhạc sĩ nào sáng tác bài Quốc ca Việt Nam?","Văn Cao",["Hoàng Vân","Phạm Tuyên","Mô-da"],"Tiến quân ca của nhạc sĩ Văn Cao."]]],
["🏫🎒🎵","Có 7 tên nốt nhạc: Đô, Rê, Mi, Pha, Son, La, Si. Rất nhiều bài hát chỉ dùng mấy nốt đó.",[["Có bao nhiêu tên nốt nhạc cơ bản?","7",["5","6","10"],"Đô, Rê, Mi, Pha, Son, La, Si."],["Sau nốt Mi là nốt nào?","Pha",["Rê","Son","La"],"Đô, Rê, Mi, Pha, Son, La, Si."],["Nốt nào đứng ngay trước nốt La?","Son",["Si","Pha","Mi"],"…Pha, Son, La, Si."]]],
["🎋🪘🌄","Đàn t’rưng làm từ ống tre nứa, tiếng đàn nghe như tiếng suối chảy.",[["Quan họ là dân ca của vùng nào?","Bắc Ninh",["Huế","Tây Nguyên","Nam Bộ"],"Dân ca quan họ Bắc Ninh."],["Hát ru thường có nhịp điệu thế nào?","Chậm rãi, êm dịu",["Nhanh, sôi nổi","Mạnh mẽ","Giật giọng"],"Để ru em bé ngủ."]]],
["🎻🌸🧧","Đàn vi-ô-lông được gọi là “nữ hoàng của các nhạc cụ” vì âm thanh đẹp và giàu cảm xúc.",[["Khóa Son được đặt ở đâu trên khuông nhạc?","Đầu khuông nhạc",["Cuối khuông nhạc","Giữa khuông nhạc","Ngoài khuông nhạc"],"Khóa Son mở đầu mỗi khuông nhạc."],["Khuông nhạc có mấy dòng kẻ?","5 dòng kẻ",["3 dòng kẻ","4 dòng kẻ","7 dòng kẻ"],"5 dòng kẻ và 4 khe."],["Bài “Đón xuân về” nên hát với sắc thái:","Vui tươi, rộn ràng",["Buồn","Chậm, nặng nề","Giận dữ"],"Mùa xuân vui tươi."]]],
["🌈👧👦","Nốt trắng ngân dài gấp đôi nốt đen, nốt đen ngân dài gấp đôi nốt móc đơn.",[["Nốt đen ngân dài bằng mấy phách?","1 phách",["2 phách","4 phách","Nửa phách"],"Nốt đen = 1 phách."],["Nốt trắng ngân dài bằng mấy phách?","2 phách",["1 phách","3 phách","4 phách"],"Nốt trắng = 2 nốt đen."]]],
["🐦🇫🇷🎼","Mô-da biết chơi đàn từ năm 3 tuổi và sáng tác bản nhạc đầu tiên khi mới 5 tuổi.",[["Mô-da bắt đầu sáng tác nhạc khi mấy tuổi?","5 tuổi",["15 tuổi","20 tuổi","30 tuổi"],"Mô-da là thần đồng âm nhạc."],["Van-xơ (waltz) là điệu nhạc thường dùng để:","Khiêu vũ nhịp nhàng",["Chào cờ","Ru em","Diễu hành"],"Điệu van-xơ nhịp 3/4."]]],
["🐬☀️🏖️","Cá heo “nói chuyện” với nhau bằng tiếng huýt và rất thích âm nhạc.",[["Đàn pi-a-nô thuộc loại nhạc cụ nào?","Nhạc cụ phím",["Nhạc cụ thổi","Nhạc cụ kéo","Nhạc cụ gõ"],"Bấm phím để phát ra âm thanh."],["Sáo trúc được chơi bằng cách:","Thổi",["Gõ","Kéo","Lắc"],"Sáo là nhạc cụ thổi."],["Thanh phách, song loan là nhạc cụ:","Gõ",["Thổi","Kéo","Phím"],"Nhạc cụ gõ dân tộc."]]]],
mt:[
["🎨🖌️✏️","Người tiền sử đã vẽ tranh lên vách hang từ hàng chục nghìn năm trước.",[["Mĩ thuật có ở đâu trong cuộc sống?","Ở khắp nơi: tranh, tượng, quần áo, đồ dùng",["Chỉ trong bảo tàng","Chỉ trong sách","Không ở đâu"],"Cái đẹp có ở quanh ta."],["Tác phẩm tạo ra bằng cách nặn, đắp, tạc gọi là:","Tượng (điêu khắc)",["Tranh","Ảnh","Sách"],"Tranh vẽ trên mặt phẳng, tượng có khối."]]],
["👘🧶🔷","Người Mông dùng sáp ong vẽ hoa văn lên vải rồi mới nhuộm chàm, phần có sáp sẽ giữ màu trắng.",[["Hoa văn hình con vật, bông hoa được vẽ đơn giản lại gọi là:","Cách điệu",["Sao chép","Tô nền","Phối cảnh"],"Cách điệu là làm đơn giản và đẹp hơn."],["Vải thổ cẩm là:","Vải dệt có nhiều hoa văn, màu sắc rực rỡ",["Vải trắng trơn","Giấy màu","Vải ni lông"],"Thổ cẩm là sản phẩm dệt thủ công của đồng bào dân tộc."]]],
["🌈🔴🔵","Từ ba màu cơ bản đỏ, vàng, lam, họa sĩ pha ra được hầu hết các màu khác.",[["Ba màu cơ bản là:","Đỏ, vàng, lam",["Cam, tím, xanh lá","Đen, trắng, xám","Hồng, nâu, tím"],"Còn gọi là màu gốc."],["Màu nào là màu nóng?","Đỏ, cam, vàng",["Xanh lam, tím","Xanh lá, lam","Đen, xám"],"Màu nóng gợi cảm giác ấm áp."],["Màu nào là màu lạnh?","Xanh lam, xanh lá, tím",["Đỏ, cam","Vàng, cam","Hồng, đỏ"],"Màu lạnh gợi cảm giác mát mẻ."]]],
["🧊⚽🎁","Kim tự tháp Ai Cập có dạng khối chóp và đã đứng vững hơn 4 000 năm.",[["Hộp phấn có dạng khối gì?","Khối hộp chữ nhật",["Khối cầu","Khối trụ","Khối nón"],"Sáu mặt đều là hình chữ nhật."],["Quả bóng có dạng khối gì?","Khối cầu",["Khối trụ","Khối lập phương","Khối nón"],"Tròn đều mọi phía."]]],
["♻️🍂🧴","Một chai nhựa phải mất hàng trăm năm mới phân hủy, vì vậy tái sử dụng là rất có ích.",[["Vỏ hộp sữa đã rửa sạch có thể dùng làm:","Hộp bút, đồ chơi, chậu cây nhỏ",["Bát ăn cơm","Cốc uống nước nóng","Không dùng được"],"Sáng tạo từ đồ đã dùng."],["Khi dùng vật liệu đã qua sử dụng, em cần:","Rửa sạch, lau khô, tránh vật sắc nhọn",["Dùng ngay khi còn bẩn","Dùng mảnh kính vỡ","Dùng lon còn cạnh sắc"],"An toàn và vệ sinh."]]],
["💐👩‍🏫💌","Ngày Nhà giáo Việt Nam 20 tháng 11 được tổ chức lần đầu trên cả nước vào năm 1982.",[["Thiệp chúc mừng thầy cô nên vẽ hình gì?","Bông hoa, quyển sách, thầy cô và học sinh",["Xe tăng","Khủng long đánh nhau","Hình đáng sợ"],"Chọn hình ảnh vui tươi, ý nghĩa."],["Lời chúc trên thiệp nên:","Ngắn gọn, chân thành, viết sạch đẹp",["Thật dài","Viết ẩu","Chép giống hệt bạn"],"Lời chúc từ tấm lòng."]]],
["🏞️🌳🏠","Vật ở gần trông to, vật ở xa trông nhỏ: họa sĩ dùng điều này để tranh có chiều sâu.",[["Muốn tranh có chiều sâu, cảnh ở xa nên vẽ:","Nhỏ hơn và nhạt màu hơn",["To hơn","Đậm hơn","Bằng cảnh ở gần"],"Xa: nhỏ, nhạt; gần: to, rõ."],["Tranh phong cảnh làng quê thường có:","Cây đa, ao nước, cánh đồng, mái nhà",["Tòa nhà chọc trời","Tàu vũ trụ","Sân bay"],"Hình ảnh quen thuộc của làng quê."]]],
["🧓👩👨","Bức chân dung nổi tiếng nhất thế giới là “Mona Lisa” của họa sĩ Lê-ô-na đờ Vanh-xi.",[["Trên khuôn mặt, mắt nằm ở khoảng nào?","Khoảng giữa chiều cao của đầu",["Sát đỉnh đầu","Sát cằm","Trên trán"],"Mắt nằm khoảng giữa đầu."],["Vẽ chân dung bà, em có thể thể hiện đặc điểm nào?","Tóc bạc, nụ cười hiền, nếp nhăn",["Tóc xanh lá","Mặt giận dữ","Không vẽ mặt"],"Đặc điểm riêng làm tranh giống và có tình cảm."]]],
["🍚🧹📖","Tranh sinh hoạt đẹp thường có hình chính to, rõ ở giữa và hình phụ nhỏ hơn xung quanh.",[["Trong tranh, hình ảnh chính nên vẽ:","To, rõ, ở vị trí dễ nhìn",["Nhỏ ở góc","Mờ nhạt","Bị che khuất"],"Hình chính làm rõ nội dung tranh."],["Hình ảnh phụ trong tranh có tác dụng gì?","Làm tranh sinh động và rõ nội dung hơn",["Che hình chính","Không có tác dụng","Làm tranh rối"],"Hình phụ hỗ trợ hình chính."]]],
["🚦🚲🪖","Tranh cổ động thường dùng hình ảnh đơn giản, màu mạnh và ít chữ để ai nhìn cũng hiểu ngay.",[["Tranh cổ động an toàn giao thông nên có:","Hình ảnh rõ ràng và khẩu hiệu ngắn gọn",["Thật nhiều chữ nhỏ","Hình mờ","Không có nội dung"],"Dễ nhìn, dễ hiểu."],["Khẩu hiệu nào phù hợp với tranh an toàn giao thông?","Đội mũ bảo hiểm khi ngồi trên xe máy",["Ăn chín uống sôi","Chăm học chăm làm","Trồng cây gây rừng"],"Khẩu hiệu đúng đề tài."]]]],
gdtc:[
["👟💧🍎","Cơ thể em có hơn 600 cơ. Khởi động làm các cơ ấm lên và dẻo hơn nên ít bị đau.",[["Vì sao phải khởi động trước khi tập?","Để cơ, khớp quen dần, tránh chấn thương",["Để mệt hơn","Cho hết giờ","Không cần thiết"],"Khởi động rất quan trọng."],["Sau khi tập xong, em nên:","Thả lỏng, đi lại nhẹ nhàng",["Ngồi hoặc nằm ngay","Uống thật nhiều nước đá","Tắm ngay nước lạnh"],"Thả lỏng giúp cơ thể hồi phục."],["Nên tập thể dục vào lúc nào?","Buổi sáng sớm hoặc chiều mát",["Giữa trưa nắng gắt","Ngay sau khi ăn no","Lúc nửa đêm"],"Tránh nắng gắt và lúc vừa ăn no."]]],
["🧍🧍‍♂️📣","Khẩu lệnh thường có hai phần: dự lệnh (để chuẩn bị) và động lệnh (để thực hiện).",[["Khẩu lệnh “Nghiêm!” yêu cầu em:","Đứng thẳng, hai tay khép sát đùi, mắt nhìn thẳng",["Ngồi xuống","Chạy tại chỗ","Giải tán"],"Tư thế đứng nghiêm."],["Khẩu lệnh “Nghỉ!” thì em:","Chùng một chân, đứng thoải mái",["Ngồi bệt xuống","Chạy đi chơi","Nằm xuống"],"Vẫn đứng trong hàng."],["Khi dóng hàng dọc, em nhìn vào đâu?","Gáy của bạn đứng trước",["Mặt bạn bên cạnh","Xuống đất","Lên trời"],"Nhìn gáy bạn phía trước để hàng thẳng."]]],
["🤸🙆‍♂️🎶","Tập thể dục buổi sáng khoảng 10 phút giúp em tỉnh táo và học tốt hơn cả ngày.",[["Bài thể dục thường được tập theo:","Nhịp đếm 1 – 2 – 3 – 4…",["Tùy thích","Không cần nhịp","Thật nhanh"],"Tập đều theo nhịp."],["Động tác vươn thở giúp:","Hít thở sâu, giãn lồng ngực",["Chạy nhanh hơn","Nhảy cao hơn","Ném xa hơn"],"Mở đầu bài thể dục."],["Động tác điều hòa ở cuối bài có tác dụng:","Giúp cơ thể thả lỏng, hồi phục",["Làm mệt thêm","Tăng tốc","Khởi động"],"Kết thúc nhẹ nhàng."]]],
["🏃‍♂️⚽🚧","Tung và bắt bóng giúp mắt và tay phối hợp tốt hơn, có ích cả khi viết chữ.",[["Khi chạy đổi hướng, em cần:","Giảm tốc độ và quan sát",["Tăng tốc hết sức","Nhắm mắt","Nhìn ra sau"],"Tránh trượt ngã và va chạm."],["Khi bật nhảy tiếp đất, nên:","Chùng gối để giảm chấn động",["Thẳng cứng chân","Tiếp đất bằng gót","Ngã người ra sau"],"Chùng gối giúp tiếp đất êm."]]],
["🏀⛹️‍♂️🧺","Môn bóng rổ ra đời năm 1891; chiếc rổ đầu tiên là một cái giỏ đựng đào.",[["Mỗi đội bóng rổ có mấy người trên sân?","5 người",["11 người","6 người","2 người"],"Bóng rổ: 5 người mỗi đội."],["Trong bóng rổ, cầm bóng chạy mà không đập bóng là:","Lỗi chạy bước",["Ghi điểm","Đúng luật","Phát bóng"],"Phải dẫn bóng khi di chuyển."]]],
["🏊🛟🌊","Biết bơi là kĩ năng có thể cứu mạng. Tuyệt đối không tự đi bơi ở ao, hồ, sông, suối.",[["Kiểu bơi nào thường được học đầu tiên?","Bơi ếch hoặc bơi trườn sấp",["Bơi bướm","Lặn sâu","Nhảy cầu"],"Tùy chương trình, thường là ếch hoặc trườn sấp."],["Thấy bạn bị đuối nước, em nên:","Kêu to gọi người lớn, ném phao hoặc sào cho bạn",["Nhảy xuống cứu","Chạy đi","Đứng nhìn"],"Trẻ em không tự nhảy xuống cứu."],["Dụng cụ nào giúp người mới tập bơi nổi trên nước?","Phao bơi",["Kính râm","Giày","Mũ lưỡi trai"],"Phao giúp nổi và an toàn."]]]],
hdtn:[
["🙋‍♂️😊🎈","Mỗi người có một điểm đáng yêu riêng. Biết giới thiệu về mình giúp em dễ kết bạn hơn.",[["Khi giới thiệu về mình trước lớp, em nên:","Nói to, rõ, nhìn các bạn và mỉm cười",["Nói lí nhí","Cúi mặt","Quay lưng lại"],"Tự tin giới thiệu."],["“Chân dung em” có thể được thể hiện bằng:","Tranh vẽ, lời kể, sản phẩm tự làm",["Chỉ bằng ảnh thẻ","Không cách nào","Chép của bạn"],"Nhiều cách để nói về mình."]]],
["⏰🧼👕","Một thói quen tốt cần lặp lại nhiều ngày liên tục mới thành nếp.",[["Thời gian biểu giúp em:","Làm việc đúng giờ, không quên việc",["Chơi nhiều hơn","Ngủ ít đi","Bận rộn hơn"],"Sắp xếp thời gian hợp lí."],["Buổi sáng thức dậy, việc nên làm là:","Gấp chăn màn, vệ sinh cá nhân",["Nằm thêm thật lâu","Xem điện thoại ngay","Bỏ ăn sáng"],"Nếp sống gọn gàng."]]],
["🏫❤️🌼","Tình bạn đẹp giúp em vui hơn và học tốt hơn. Bạn tốt là người cùng nhau tiến bộ.",[["Bạn mới chuyển đến lớp, em nên:","Làm quen và giúp bạn hòa nhập",["Không chơi với bạn","Trêu bạn","Kệ bạn"],"Thân thiện với bạn mới."],["Thầy cô ốm, em có thể:","Gửi lời hỏi thăm, chúc thầy cô mau khỏe",["Vui vì được nghỉ","Không quan tâm","Làm ồn hơn"],"Quan tâm đến thầy cô."]]],
["🧺🛏️✨","Dọn dẹp 10 phút mỗi ngày nhẹ nhàng hơn nhiều so với dọn cả ngày cuối tuần.",[["Việc nhà nào hợp với học sinh lớp 3?","Quét nhà, gấp quần áo, rửa cốc chén",["Sửa điện","Trèo lên mái nhà","Dùng dao to chặt xương"],"Chọn việc vừa sức, an toàn."],["Quần áo sạch sau khi phơi khô cần:","Gấp gọn và xếp vào tủ",["Vo tròn lại","Để trên ghế","Vứt lên giường"],"Gọn gàng, dễ tìm."]]],
["👨‍👩‍👧💕🍲","Bữa cơm gia đình là lúc cả nhà quây quần, kể cho nhau nghe chuyện trong ngày.",[["Trong bữa cơm, em nên:","Mời ông bà, bố mẹ trước khi ăn",["Ăn trước một mình","Vừa ăn vừa xem điện thoại","Chê món ăn"],"Lễ phép trong bữa ăn."],["Ông bà ở xa, em có thể thể hiện tình cảm bằng cách:","Gọi điện hỏi thăm thường xuyên",["Không liên lạc","Chờ ông bà gọi","Quên luôn"],"Quan tâm dù ở xa."]]],
["🥗🧼🍎","Bàn tay bẩn có thể mang hàng triệu vi khuẩn mà mắt thường không nhìn thấy.",[["Rau sống trước khi ăn cần:","Rửa kĩ dưới vòi nước sạch",["Ăn ngay","Lau qua bằng tay","Ngâm nước ao"],"Rửa sạch để loại bụi bẩn, hóa chất."],["Thực phẩm nào là dấu hiệu KHÔNG an toàn?","Có mùi lạ, mốc, đổi màu",["Tươi, màu tự nhiên","Còn hạn sử dụng","Được bảo quản lạnh"],"Thấy lạ thì không ăn."]]],
["🤲🌍💛","“Lá lành đùm lá rách”: người có điều kiện hơn giúp đỡ người gặp khó khăn.",[["Câu tục ngữ nào nói về tinh thần giúp đỡ nhau?","Lá lành đùm lá rách",["Gần mực thì đen","Chậm như rùa","Nước chảy đá mòn"],"Tinh thần tương thân tương ái."],["Em có thể góp gì ủng hộ các bạn vùng lũ?","Sách vở, quần áo còn tốt, tiền tiết kiệm",["Đồ hỏng","Rác","Không gì cả"],"Chia sẻ điều mình có."]]],
["🌳🐝💧","Tắt vòi nước khi đánh răng có thể tiết kiệm hơn 10 lít nước mỗi lần.",[["Việc nào tiết kiệm nước?","Khóa vòi khi đang xát xà phòng",["Để vòi chảy suốt","Nghịch nước","Xả nước thật lâu"],"Dùng nước vừa đủ."],["Rác nào có thể tái chế?","Giấy, chai nhựa, lon nhôm",["Vỏ chuối","Cơm thừa","Lá rụng"],"Rác tái chế được thu gom để làm sản phẩm mới."],["Túi ni lông có hại cho môi trường vì:","Rất lâu phân hủy",["Tan ngay trong nước","Là thức ăn cho cá","Làm đất tốt hơn"],"Nên dùng túi vải, làn nhựa dùng nhiều lần."]]],
["👩‍⚕️👨‍🚒👩‍🏫","Trên thế giới có hàng nghìn nghề khác nhau, và nghề nào chân chính cũng đáng quý.",[["Người chữa bệnh cho mọi người là:","Bác sĩ",["Thợ may","Kĩ sư xây dựng","Phi công"],"Bác sĩ khám và chữa bệnh."],["Người dập tắt đám cháy, cứu người là:","Lính cứu hỏa",["Nông dân","Đầu bếp","Ca sĩ"],"Lính cứu hỏa rất dũng cảm."],["Người trồng lúa, trồng rau là:","Nông dân",["Thợ điện","Giáo viên","Bác sĩ"],"Nông dân làm ra lương thực."]]]]};

const misspell=w=>{const out=new Set();let t=0;while(out.size<3&&t++<40){const a=w.split("");const i=R(0,a.length-2);const k=R(0,2);if(a[i]===" "||a[i+1]===" ")continue;if(k===0)[a[i],a[i+1]]=[a[i+1],a[i]];else if(k===1)a.splice(i+1,0,a[i]);else a.splice(i,1);const v=a.join("");if(v!==w&&v.length>1)out.add(v)}return[...out]};
const unitGens0=unitGens;unitGens=function(u){const gs=unitGens0(u);
 const listen=()=>{const[en,vi]=pick(u.w);const o=shuffle(u.w.filter(x=>x[1]!==vi)).slice(0,3);return{q:"Nghe rồi chọn nghĩa của từ em nghe được:",o:[vi].concat(o.map(x=>x[1])),e:`Từ vừa nghe: ${en} = ${vi}.`,say:en}};
 const spell=()=>{const c=u.w.filter(x=>x[0].length>=4);const[en,vi]=pick(c.length?c:u.w);const w=misspell(en);return w.length<3?null:{q:`Từ nào viết đúng chính tả? (nghĩa: ${vi})`,o:[en].concat(w),e:`Viết đúng: ${en}.`,say:en}};
 return gs.concat([listen,listen,spell,spell])};

 if(b.on&&!depth){const sib=b._cd[1].filter(x=>!x.on);let pool=[];sib.forEach(x=>{pool=pool.concat(buildBai(sid,x,1).slice(0,6))});shuffle(pool).forEach(add);return out.slice(0,12)}

function runTerm(sid,k){let qs=[],used=new Set();const add=q=>{if(!q||!q.o)return;const key=q.q+"#"+q.o[0];if(used.has(key))return;used.add(key);q.sid=sid;qs.push(q)};

 else{const us=UNITS.slice(k===1?0:10,k===1?10:20);let t=0;while(qs.length<20&&t++<200){const u=us[t%us.length];try{add(pick(unitGens(u.unit))())}catch(e){}}}
 const s=SUBJ.find(x=>x.id===sid);runQuiz(qs.slice(0,20),{mode:"term",sid,title:`${s.name} · Kiểm tra học kì ${k}`,h:s.h,redo:()=>runTerm(sid,k),

/* ================= THỰC HÀNH THEO KỸ NĂNG ĐẾN 100 ĐIỂM (mô hình "Vào học" của VioEdu) ================= */
const SKM=[70,80,90,100];
const skGet=key=>{const v=V();v.sk2=v.sk2||{};return v.sk2[key]=v.sk2[key]||{s:0,r:0,w:0,m:0}};
const skPeek=key=>(V().sk2||{})[key]||{s:0,r:0,w:0,m:0};
// shortcut: thang điểm tự đặt (đúng +10 dưới 70, +5 từ 70; sai −5 / −8), không phải thuật toán của VioEdu
function skillStep(key,right){const k=skGet(key);right?k.r++:k.w++;k.s=Math.max(0,Math.min(100,k.s+(right?(k.s<70?10:5):(k.s<70?-5:-8))));if(k.s>=70)k.wk=wkId();
 SKM.forEach(m=>{if(k.s>=m&&k.m<m){k.m=m;addCoin(5);setTimeout(()=>toast(m===100?"Đạt 100 điểm! Con đã làm chủ kỹ năng này. +5 xu":`Đạt mốc ${m} điểm! +5 xu`),300)}});return k}
const skBar=key=>{const k=skPeek(key);return`<div class="skb" id="skb"><div class="skt"><i style="width:${k.s}%"></i>${SKM.map(m=>`<b class="${k.s>=m?"on":""}" style="left:${m}%"></b>`).join("")}</div><div class="skn"><span><b>${k.s}</b>/100 điểm kỹ năng</span><span>Đúng ${k.r} · Sai ${k.w}</span></div></div>`};
const skChip=key=>{const k=skPeek(key);return k.r+k.w?`<span class="skc ${k.s>=100?"full":k.s>=70?"ok":"low"}">${k.s}/100</span>`:""};
function skillMore(sid,idx){if(sid==="toan"){const qs=buildTags(TOAN_LIST[idx-1].tags);qs.forEach(q=>q.sid="toan");return qs}return buildBai(sid,BOOKL[sid][idx])}
const skillTitle=(sid,idx)=>sid==="toan"?`Bài ${idx}: ${TOAN_LIST[idx-1].t}`:BOOKL[sid][idx].t;
function skillRun(sid,idx){const key=sid+":"+idx,s=SUBJ.find(x=>x.id===sid);
 if(skPeek(key).s>=100)return sid==="toan"?runToanBai(idx):runBai(sid,idx); // đã đạt 100: ôn lại bằng bài 10 câu
 const qs=skillMore(sid,idx);if(qs.length<3)return toast("Bài này chưa có đủ câu hỏi luyện tập.");
 if(sid!=="toan"){S.book.last=S.book.last||{};S.book.last[sid]=idx;save()}
 runQuiz(qs,{mode:"skill",sid,title:`${s.name} · ${skillTitle(sid,idx)}`,h:s.h,skill:{key,more:()=>skillMore(sid,idx)},redo:()=>skillRun(sid,idx),
  after:()=>{const k=skPeek(key);weekReward();return`<p style="font-weight:800">Điểm kỹ năng: ${k.s}/100</p>${skBar(key).replace(' id="skb"',"")}`}})}
const cdStat=keys=>{let done=0,need=0;keys.forEach(k=>{const x=skPeek(k);if(x.s>=70)done++;else if(x.r+x.w)need++});return`<span class="cdst">Chủ điểm <b>${done}/${keys.length}</b>${need?` · Cần luyện tập <b>${need}</b>`:""}</span>`};
function cdKeys(sid,ci){return sid==="toan"?TOAN_LIST.filter(b=>b.cd===ci+1&&b.tags!=="*").map(b=>"toan:"+b.n):BOOK[sid].cds[ci][1].filter(b=>!b.on).map(b=>sid+":"+b._i)}
function cdTest(sid,ci){const s=SUBJ.find(x=>x.id===sid),name=sid==="toan"?TOAN_KNTT[ci][0]:(BOOK[sid].cds[ci][0]||s.name);let pool=[];const used=new Set();
 const ks=cdKeys(sid,ci);ks.forEach(k=>{pool=pool.concat(shuffle(skillMore(sid,+k.split(":")[1])).slice(0,Math.max(4,Math.ceil(12/ks.length))))});
 const qs=shuffle(pool).filter(q=>{const k=q.q+"#"+(q.o?q.o[0]:"");if(used.has(k))return false;used.add(k);q.sid=sid;return true}).slice(0,10);
 if(qs.length<5)return toast("Chủ đề này chưa đủ câu hỏi để kiểm tra.");
 runQuiz(qs,{mode:"term",sid,title:`${s.name} · Kiểm tra: ${name.replace(/^(Chủ đề|Phần) \d+: /,"")}`,h:s.h,redo:()=>cdTest(sid,ci),after:score=>{const v=V();v.cdt=v.cdt||{};const key=sid+":"+ci,p=Math.round(score/qs.length*10);if(v.cdt[key]==null||p>v.cdt[key])v.cdt[key]=p;return`<p style="color:var(--muted)">Điểm kiểm tra chủ đề: ${p}/10 · Cao nhất: ${v.cdt[key]}/10</p>`}})}
const cdHead=(sid,ci,title)=>{const t=(V().cdt||{})[sid+":"+ci];return`<div class="cdh"><p class="lgroup">${title}</p>${cdStat(cdKeys(sid,ci))}<button class="btn sec" data-cdt="${ci}">Kiểm tra chủ đề${t!=null?` · ${t}/10`:""}</button></div>`};
const bindCd=(sid,body)=>{body.querySelectorAll("[data-cdt]").forEach(b=>b.onclick=()=>cdTest(sid,+b.dataset.cdt));body.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>skillRun(sid,+b.dataset.sk))};

function weekSkills(){const w=curWeek(),f=Math.min(1,Math.max(0,(w-1)/34));let seed=0;for(const c of wkId())seed=(seed*31+c.charCodeAt(0))%2147483647;const rnd=()=>(seed=seed*48271%2147483647)/2147483647;
 const out=[];let n=S.book.toan||Math.max(1,Math.round(f*80)+1);const toanOk=x=>x>=1&&x<=81&&TOAN_LIST[x-1].tags!=="*";
 for(let x=n,c=0;x>=1&&c<2;x--)if(toanOk(x)){out.push(["toan",x]);c++}
 out.push(["ta",Math.min(19,Math.floor(f*20))]);
 const rest=["tnxh","tin","dd","cn","an","mt","hdtn","gdtc"].map(id=>[rnd(),id]).sort((a,b)=>a[0]-b[0]).slice(0,6-out.length).map(x=>x[1]);
 rest.forEach(id=>{const L=BOOKL[id];let i=Math.min(L.length-1,Math.floor(f*L.length));while(i>0&&L[i].on)i--;out.push([id,i])});return out}

function runQuiz(qs,cfg){
 app.innerHTML=`<div class="head"><button class="btn sec" id="back">← Thoát</button><div><h2>${cfg.title}</h2><p>${cfg.mode==="review"?"Trả lời đúng thì câu lên hộp cao hơn và lâu hơn mới gặp lại.":"Đọc kĩ, suy nghĩ rồi mới chọn. Có thể bấm “Gợi ý” nếu cần."}</p></div></div><div class="panel" style="--h:${cfg.h}"><div id="body"></div></div>`;
 $("#back").onclick=()=>cfg.sid?openSub(cfg.sid,"quiz"):home();
 const host=$("#body");let i=0,score=0,hints=0,retries=0;
 const render=()=>{
  const q=qs[i];q.o2=q.o2||shuffle(q.o);
  host.innerHTML=`<div class="quiz"><div class="qtop"><span>Câu ${i+1}${cfg.skill?"":" / "+qs.length}${q._retry?' <span class="chip">Luyện thêm</span>':""}</span>${q.sid&&cfg.mode!=="lv"?`<span>${SUBJ.find(s=>s.id===q.sid).name}</span>`:""}<span>Đúng: ${score}</span></div>${cfg.skill?skBar(cfg.skill.key):`<div class="bar"><i style="width:${i/qs.length*100}%"></i></div>`}${msBox(cfg,q)}
  ${q.p?`<div class="passage">${q.p}${/^[A-Z]/.test(q.p)?` <button class="say" id="sayp">nghe</button>`:""}</div>`:""}
  <p class="q">${q.q}${q.say?` <button class="say" id="sayq">nghe</button>`:(q.sid||cfg.sid)!=="ta"?` <button class="say" id="sayv">nghe đề</button>`:""}</p>
  ${q.type==="order"?orderHTML(q):q.type==="match"?matchHTML(q):q.input?`<form class="inrow" id="inf"><input id="ans" inputmode="numeric" autocomplete="off" placeholder="Nhập đáp số" aria-label="Đáp số"><button class="btn col" type="submit">Kiểm tra</button></form><p style="color:var(--muted);margin:.5em 0 0;font-size:.9rem">Tự nghĩ và gõ đáp số${q.unit?` (đơn vị:${q.unit})`:""}.</p>`
   :`<div class="opts">${q.o2.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`}
  ${q.h?`<div class="qact" style="justify-content:flex-start"><button class="btn sec" id="hbtn">Gợi ý</button></div><div id="hint"></div>`:""}
  <div id="fb"></div></div>`;
  if(q.say)$("#sayq").onclick=()=>speak(q.say);
  if($("#sayv"))$("#sayv").onclick=()=>speakVi((q.p?q.p+". ":"")+q.q+(q.type||q.input?"":". "+q.o2.join(". ")));
  if($("#sayp"))$("#sayp").onclick=()=>speak(q.p);
  if(q.h)$("#hbtn").onclick=()=>{$("#hint").innerHTML=`<div class="hint">Gợi ý: ${q.h}</div>`;$("#hbtn").disabled=true;hints++};
  const done=(right,chosen)=>{
   if(right)score++;q._ok=right;if(right&&cfg.mode!=="review")addCoin(1);if(cfg.skill){skillStep(cfg.skill.key,right);$("#skb").outerHTML=skBar(cfg.skill.key)}
   if(q._tag&&cfg.mode!=="review"){const k=S.sk[q._tag]=S.sk[q._tag]||{r:0,t:0};k.t++;if(right)k.r++}
   let rnote="";if(!right&&q._g&&!q._retry&&(cfg.mode==="lv"||cfg.mode==="book")&&retries<2){try{let nq=null,t=0;while(t++<8){nq=q._g();if(nq&&nq.o&&nq.q+nq.o[0]!==q.q+q.o[0])break}if(nq&&nq.o){nq._g=q._g;nq._retry=1;nq._tag=q._tag;nq._lv=q._lv;nq.sid=q.sid;qs.push(nq);retries++;rnote="<small>Cuối bài con sẽ được luyện thêm 1 câu cùng dạng này.</small>"}}catch(e){}}
   const whyT=!right&&q.why&&chosen!=null?(q.why[chosen]||(Object.entries(q.why).find(([k])=>norm(k)===norm(chosen))||[])[1]):"";
   S.log[today()]=(S.log[today()]||0)+1;
   {const lq=cfg.mode==="lv"?cfg.lv:q._lv,sq=q.sid||cfg.sid;if(lq&&sq&&cfg.mode!=="review"){const b0=msGet(sq,lq),v=msUpdate(sq,lq,right);const ml=$("#msl");if(ml)ml.outerHTML=msBox(cfg,q,v-b0);if(b0<80&&v>=80)setTimeout(()=>toast(`Con đã THẠO Mức ${lq}!`),300);if(b0<100&&v===100)setTimeout(()=>toast(`Con đã LÀM CHỦ Mức ${lq}!`),300)}}
   if(cfg.mode==="lv")markSeen(cfg.sid,cfg.lv,q);else if(cfg.mode==="test"&&q._lv)markSeen(cfg.sid,q._lv,q);
   if(cfg.mode==="review")boxUpdate(q._it,right);else if(!right)boxAdd(q.sid||cfg.sid,q);
   save();
   const correct=q.input?q.o[0]:q.o[0];
   $("#fb").innerHTML=`<div class="fb ${right?"ok":"no"}"><strong>${right?pick(GOOD):pick(GROW)}</strong>${right?"":`${whyT?`<span class="why">${whyT}</span>`:""}Đáp án: <b>${correct}</b>. `}${q.e}${rnote}${!right&&cfg.mode!=="review"?"<small>Câu này đã vào Hộp ôn tập, ngày mai con gặp lại nhé.</small>":""}</div><div class="qact"><button class="btn" id="next">${(cfg.skill?skPeek(cfg.skill.key).s<100:i+1<qs.length)?"Câu tiếp theo →":"Xem kết quả"}</button></div>`;
   host.querySelector(".qtop span:last-child").textContent="Đúng: "+score;
   if($("#hbtn"))$("#hbtn").disabled=true;
   $("#next").focus();$("#next").onclick=()=>{i++;if(cfg.skill){if(skPeek(cfg.skill.key).s>=100)return end();if(i>=qs.length)cfg.skill.more().forEach(x=>qs.push(x))}i<qs.length?render():end()};
  };
  if(q.type==="order")bindOrder(q,host,done);else if(q.type==="match")bindMatch(q,host,done);else if(q.input){const f=$("#inf");$("#ans").focus();f.onsubmit=e=>{e.preventDefault();const v=$("#ans").value;if(!v.trim())return;const ok=norm(v)===norm(q.ans);$("#ans").disabled=true;f.querySelector("button").disabled=true;$("#ans").style.borderColor=ok?"var(--good)":"var(--red)";done(ok,v)}}
  else host.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const right=q.o2[+b.dataset.k]===q.o[0];host.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const v=q.o2[+x.dataset.k];if(v===q.o[0])x.classList.add("ok");else if(x===b)x.classList.add("no")});done(right,q.o2[+b.dataset.k])});
 };
 const end=()=>{
  if(cfg.skill)qs.length=i; // chỉ tính các câu đã trả lời
  const st=starsFor(score,qs.length);let extra="";
  if(cfg.mode==="lv"){S.p[cfg.sid]=S.p[cfg.sid]||{};const wasOpen=unlocked(cfg.sid,cfg.lv+1);const prev=S.p[cfg.sid][cfg.lv];if(!prev||score>prev.best)S.p[cfg.sid][cfg.lv]={best:score,total:qs.length,stars:st};
   if(cfg.lv<3&&!wasOpen&&unlocked(cfg.sid,cfg.lv+1))extra=`<div class="unlock">Đã mở khóa ${LVN[cfg.lv+1]}!</div>`;
   else if(cfg.lv<3&&!unlocked(cfg.sid,cfg.lv+1))extra=`<p style="color:var(--muted)">Cần ${Math.ceil(qs.length*.8)}/${qs.length} để mở Mức ${cfg.lv+1}. Xem lại bài học rồi thử lại nhé.</p>`}
  if(cfg.mode==="all"){if(!S.all||score>S.all.best)S.all={best:score,total:qs.length,stars:st}}
  if(cfg.mode==="test"){S.test=S.test||{};const pv=S.test[cfg.sid];if(!pv||score>pv.best)S.test[cfg.sid]={best:score,total:qs.length,d:today().split("-").reverse().join("/")};const by=[1,2,3].map(l=>{const a=qs.filter(q=>q._lv===l);return a.length?`Mức ${l}: ${a.filter(q=>q._ok).length}/${a.length}`:""}).filter(Boolean).join(" · ");extra=`<p style="font-weight:700">${by}</p><p style="color:var(--muted)">Xếp loại: ${score>=18?"Hoàn thành tốt":score>=10?"Hoàn thành":"Chưa hoàn thành, cần ôn thêm"}</p>`}
  if(cfg.after)extra+=cfg.after(score,qs);
  if(cfg.mid)missionDone(cfg.mid);earnFreeze();
  save();checkBadges();
  const msg=cfg.mode==="review"?`Con đã ôn ${qs.length} câu. Còn ${dueItems().length} câu cần ôn hôm nay.`:st===3?"Xuất sắc! Thành đã làm chủ phần này.":st===2?"Làm tốt lắm! Cố thêm chút nữa là 3 sao.":st===1?"Khá rồi! Xem lại bài học rồi làm lại nhé.":"Không sao cả. Mỗi lần làm lại là não con mạnh thêm!";
  host.innerHTML=`<div class="quiz end"><div class="big">${score}/${qs.length}</div>${cfg.mode==="review"?"":`<div class="st">${[0,1,2].map(k=>starSvg(k<st)).join("")}</div>`}<p style="font-weight:800;font-size:1.15rem">${msg}</p>${hints?`<p style="color:var(--muted)">Con đã dùng ${hints} gợi ý. Lần sau thử tự làm trước nhé.</p>`:""}${extra}
  <div class="qact" style="justify-content:center"><button class="btn" id="again">${cfg.mode==="review"?"Về trang chính":"Làm bài mới"}</button>${cfg.sid?`<button class="btn sec" id="learn">Xem lại bài học</button><button class="btn sec" id="lvls">Chọn mức</button>`:""}${cfg.mode!=="review"?`<button class="btn sec" id="h">Về trang chính</button>`:""}</div></div>`;
  if(cfg.bind)cfg.bind();
  $("#again").onclick=()=>{if(cfg.redo)cfg.redo();else if(cfg.mode==="review")home();else if(cfg.mode==="all")runQuiz(buildAll(),cfg);else if(cfg.mode==="test")runQuiz(buildTest(SUBJ.find(s=>s.id===cfg.sid)),cfg);else runQuiz(build(SUBJ.find(s=>s.id===cfg.sid),cfg.lv),Object.assign({},cfg,{mid:null}))};
  if(cfg.sid){$("#learn").onclick=()=>openSub(cfg.sid,"learn");$("#lvls").onclick=()=>openSub(cfg.sid,"quiz")}
  if($("#h"))$("#h").onclick=home;
 };

 ${SUBJ.map(s=>`<tr><td>${s.name}</td>${[1,2,3].map(l=>{const r=lvRec(s.id,l);const v=r?r.best/r.total:null;const mv=msGet(s.id,l);return`<td class="p ${mv?cls(mv/100):cls(v)}">${r?`${r.best}/${r.total}`:unlocked(s.id,l)?"–":"khóa"}${mv?`<br><small>TT ${mv}</small>`:""}</td>`}).join("")}<td class="p ${(()=>{const t=(S.test||{})[s.id];return t?cls(t.best/t.total):""})()}">${(S.test||{})[s.id]?`${S.test[s.id].best}/${S.test[s.id].total}`:"–"}</td><td class="p">${wrongBy[s.id]||0}</td></tr>`).join("")}</table></div>
 <p style="font-size:.9rem">“TT” là điểm thành thạo 0–100: tăng khi làm đúng, giảm khi làm sai, đạt 80 là thạo, 100 là làm chủ. Xanh: từ 80. Vàng: 50–79%. Đỏ: dưới 50%, nên cùng con xem lại bài học.</p></div>
 <div class="row2" style="margin-top:0">
  <div class="box"><h3>7 ngày gần đây</h3><svg viewBox="0 0 300 130" style="width:100%;height:auto" role="img" aria-label="Số câu đã làm mỗi ngày">${days.map((d,k)=>{const h=d[1]/mx*90;return`<rect x="${12+k*41}" y="${100-h}" width="28" height="${h}" rx="4" style="fill:${d[1]>=GOAL?"var(--good)":"var(--star)"}"/><text x="${26+k*41}" y="${95-h}" text-anchor="middle" style="fill:var(--ink);font:700 11px var(--body)">${d[1]||""}</text><text x="${26+k*41}" y="118" text-anchor="middle" style="fill:var(--muted);font:600 11px var(--body)">${d[0].slice(8)}/${d[0].slice(5,7)}</text>`}).join("")}<line x1="8" x2="296" y1="${100-GOAL/mx*90}" y2="${100-GOAL/mx*90}" style="stroke:var(--muted);stroke-dasharray:4 4"/></svg><p>Đường gạch là mục tiêu ${GOAL} câu mỗi ngày. Chuỗi hiện tại: ${streak()} ngày.</p></div>
  <div class="box"><h3>Hộp ôn tập Leitner</h3><div class="tbl"><table><tr><th>Hộp</th><th>Số câu</th><th>Gặp lại sau</th></tr>${boxes.map((n,k)=>`<tr><td>Hộp ${k+1}</td><td>${n}</td><td>${GAP[k+1]} ngày</td></tr>`).join("")}<tr><td>Đã thuộc</td><td>${S.mastered}</td><td>–</td></tr></table></div><p>Câu sai vào Hộp 1. Mỗi lần ôn đúng, câu lên hộp cao hơn và cách lâu hơn mới gặp lại. Đúng ở Hộp 4 thì tính là đã thuộc.</p></div>
 </div>
 <div class="box" style="margin-top:14px"><h3>Toán: tỉ lệ đúng theo từng dạng bài <small>dạng yếu nhất xếp trên</small></h3>${skillHTML(12,true)}</div>
 <h3 style="margin:22px 0 10px;font-size:1.4rem">Các phương pháp học được áp dụng</h3>
 <div class="method">
  <div><h4>Học làm chủ (Mastery Learning)</h4><p>Theo B. Bloom: đạt 8/10 ở một mức rồi mới lên mức sau, tránh học chồng lên lỗ hổng. Bật điều kiện này trong phần Cài đặt bên dưới nếu muốn bắt buộc.</p></div>
  <div><h4>3 mức đánh giá</h4><p>Mức 1 nhận biết, Mức 2 hiểu và giải bài quen thuộc, Mức 3 vận dụng vào tình huống mới, theo tinh thần Thông tư 27/2020/TT-BGDĐT.</p></div>
  <div><h4>Lặp lại ngắt quãng (Leitner)</h4><p>Câu sai được ôn lại sau 1, 2, 4, 7 ngày, đúng lúc sắp quên, giúp nhớ lâu.</p></div>
  <div><h4>Luyện truy xuất</h4><p>Ở Mức 2 và 3 của Toán, con phải tự gõ đáp số thay vì chọn, buộc não tự nhớ lại.</p></div>
  <div><h4>Học xen kẽ</h4><p>Bài ôn tổng hợp trộn các môn và dạng bài, rèn khả năng nhận ra cần dùng kiến thức nào.</p></div>
  <div><h4>Ví dụ mẫu và gợi ý từng bước</h4><p>Bài nâng cao có ví dụ giải mẫu và nút Gợi ý, như người lớn đỡ một tay rồi buông dần.</p></div>
  <div><h4>Sơ đồ đoạn thẳng (mô hình thanh)</h4><p>Cách giải toán có lời văn bằng hình vẽ, dùng rộng rãi trong chương trình Toán Singapore.</p></div>
  <div><h4>Tư duy phát triển</h4><p>Lời nhận xét khen nỗ lực và coi sai là cơ hội học (theo C. Dweck), không chê con.</p></div>
  <div><h4>Dạy lại (hiệu ứng người giảng)</h4><p>Cuối mỗi bài học, con kể lại cho bố mẹ 3 điều đã học. Bố mẹ chỉ cần lắng nghe và hỏi “vì sao?”.</p></div>
  <div><h4>Điểm thành thạo (IXL, Khan)</h4><p>Mỗi mức có điểm 0–100 tăng khi đúng, giảm khi sai; phản ánh sát hơn một bài 10 câu.</p></div>
  <div><h4>Nhiệm vụ hằng ngày (VioEdu)</h4><p>Mỗi ngày 3 việc: ôn câu sai hoặc tính nhẩm, bài theo sách, mức đang yếu nhất.</p></div>
  <div><h4>Luyện tính nhẩm (Zearn)</h4><p>60 giây tính nhanh, lưu kỉ lục, giúp con thuộc bảng nhân chia.</p></div>
  <div><h4>Huy hiệu, đóng băng chuỗi (Duolingo)</h4><p>Khen nỗ lực, không tạo áp lực: lỡ nghỉ 1 ngày vẫn giữ chuỗi.</p></div>
  <div><h4>Phản hồi chỉ đúng lỗi sai</h4><p>Đáp án nhiễu của Toán là các lỗi học sinh hay mắc (nhầm chu vi với diện tích, cộng trước nhân sau…). Chọn nhầm thì phần mềm nói rõ con nhầm ở đâu.</p></div>
  <div><h4>Luyện thêm dạng vừa sai</h4><p>Sai một câu tự sinh thì cuối bài có thêm 1 câu cùng dạng (tối đa 2 câu) để sửa ngay.</p></div>
  <div><h4>Nhiều hình thức câu hỏi</h4><p>Ngoài chọn đáp án và gõ đáp số còn có sắp xếp thứ tự và nối cặp, buộc con tự nhớ lại thay vì đoán.</p></div>
  <div><h4>Báo cáo theo dạng bài</h4><p>Toán được thống kê tỉ lệ đúng theo từng dạng để biết chính xác con hổng phần nào.</p></div>
  <div><h4>Học tập trung ngắn</h4><p>Nút hẹn giờ 15 phút học, 5 phút nghỉ, hợp với khả năng tập trung của trẻ 8 tuổi.</p></div>
 </div>
