<style>
/* Layout: vở ô li — nền giấy kẻ ô, mỗi môn là một nhãn vở màu riêng; 3 mức học như 3 bậc thang; bút đỏ chấm bài, sao vàng khen thưởng */
:root{
  --paper:#F5F8FD; --grid:#DCE6F5; --card:#FFFFFF; --ink:#1D355F; --muted:#5B6E8F;
  --line:#CBD7EA; --red:#D23F35; --good:#2E8B57; --goodbg:#E3F4EA; --badbg:#FBE7E5; --warnbg:#FFF4D6;
  --star:#E8A417; --sub-s:62%; --sub-l:46%; --sub-bg-l:93%; --focus:#2B6BD6;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111827; --grid:#1B2538; --card:#1A2335; --ink:#E6ECF7; --muted:#9AA9C4;
  --line:#2C3A55; --red:#F07A70; --good:#6FD39A; --goodbg:#16362A; --badbg:#3B1D1D; --warnbg:#3A3218;
  --star:#F5C04A; --sub-s:60%; --sub-l:68%; --sub-bg-l:20%; --focus:#7FAAF5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1B2538; --card:#1A2335; --ink:#E6ECF7; --muted:#9AA9C4;
  --line:#2C3A55; --red:#F07A70; --good:#6FD39A; --goodbg:#16362A; --badbg:#3B1D1D; --warnbg:#3A3218;
  --star:#F5C04A; --sub-s:60%; --sub-l:68%; --sub-bg-l:20%; --focus:#7FAAF5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;flex:none;border-radius:16px;box-shadow:0 4px 12px rgba(20,40,90,.25)}
.install{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start}
.install img{width:48px;height:48px;border-radius:12px;flex:none}
.install p{margin:4px 0 0;color:var(--muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
.top h1 span{color:var(--red)}
.top p{margin:4px 0 0;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pill svg{width:24px;height:24px;fill:var(--star)}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard .k{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.tcard .v{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tcard .v small{font-size:1rem;color:var(--muted);font-weight:700}
.tcard.due{border-color:var(--red)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sub{--c:hsl(var(--h) var(--sub-s) var(--sub-l));--cb:hsl(var(--h) 70% var(--sub-bg-l));text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.sub:hover{border-color:var(--c)}
.sub .label{background:var(--cb);padding:14px 16px 10px;display:flex;align-items:center;gap:12px;border:none;border-bottom:2px dashed var(--c);width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.sub .label .more{margin-left:auto;font-size:.85rem;font-weight:800;color:var(--muted);white-space:nowrap}
.badge{width:46px;height:46px;flex:none;border-radius:12px;background:hsl(var(--h) var(--sub-s) var(--sub-l));color:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
.sub h3{font-size:1.3rem}
.sub .meta{padding:10px 16px 14px;color:var(--muted);font-size:.93rem;display:flex;flex-direction:column;gap:8px;flex:1}
.steps{display:flex;gap:6px}
.stp{flex:1;border-radius:10px;padding:6px 0;min-height:44px;text-align:center;font:inherit;font-size:.85rem;font-weight:800;border:2px solid var(--line);color:var(--muted);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.stp small{font-size:.72rem;font-weight:700;opacity:.85}
.stp:active{transform:scale(.97)}
.stp.done{background:var(--c);border-color:var(--c);color:var(--card)}
.stp.open{border-color:var(--c);color:var(--ink)}
.stp:hover{background:var(--cb)}
.stp.done:hover{background:var(--c)}
.row2{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h3{font-size:1.25rem}
.box p{margin:0;color:var(--muted)}
.btn{border:none;border-radius:12px;padding:11px 20px;font-weight:800;background:var(--ink);color:var(--paper);align-self:flex-start}
.btn.sec{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.col{background:var(--c);color:var(--card)}
.btn.warn{background:var(--red);color:var(--card)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:16px}
.head h2{font-size:clamp(1.7rem,5vw,2.4rem)}
.head p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:800}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--card)}
.panel{--c:hsl(var(--h) var(--sub-s) var(--sub-l));--cb:hsl(var(--h) 70% var(--sub-bg-l))}
.lessons{display:flex;flex-direction:column;gap:10px}
.lgroup{font-family:var(--display);font-size:1.15rem;font-weight:800;margin:10px 0 0;color:var(--muted)}
details{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden}
details[open]{border-color:var(--c)}
summary{list-style:none;padding:13px 16px;font-weight:800;display:flex;gap:10px;align-items:center;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .n{font-family:var(--display);color:var(--c);min-width:1.6em;font-variant-numeric:tabular-nums}
summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--muted)}
details[open] summary::after{content:"−"}
.chip{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--red);color:var(--card)}
.lb{padding:0 18px 16px;max-width:70ch}
.lb ul,.lb ol{padding-left:1.3em;margin:.4em 0}
.lb li{margin:.2em 0}
.lb b{color:var(--c)}
.tip{background:var(--cb);border-radius:10px;padding:10px 12px;margin-top:8px}
.ex{border:2px dashed var(--c);border-radius:12px;padding:10px 12px;margin:.6em 0}
.ex h4{margin:0 0 4px;font-family:var(--display);font-size:1.05rem}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:.4em 0}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 10px;text-align:left}
.tbl th{background:var(--cb)}
.bm{width:100%;max-width:420px;height:auto;display:block;margin:.4em 0}
.bm rect{fill:var(--cb);stroke:var(--c);stroke-width:2}
.bm text{fill:var(--ink);font:700 14px var(--body)}
.bm .q{fill:var(--red)}
.bm path,.bm line{stroke:var(--muted);stroke-width:2;fill:none}
.bm circle{fill:var(--c)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:.5em 0}
.word{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:baseline}
.word span{color:var(--muted);font-size:.9rem}
.word:hover{border-color:var(--c)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:.6em 0}
.key{min-width:52px;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:10px 8px;font-weight:800;text-align:center}
.mix{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:.6em 0}
.dot{width:54px;height:54px;border-radius:50%;border:3px solid var(--line)}
.dot.sel{border-color:var(--ink)}
.res{width:70px;height:70px;border-radius:16px;border:3px solid var(--line)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.lvl{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.lvl.open{border-color:var(--c)}
.lvl h3{font-size:1.3rem;display:flex;gap:8px;align-items:center}
.lvl .num{width:34px;height:34px;border-radius:10px;background:var(--c);color:var(--card);display:grid;place-items:center}
.lvl.lock .num{background:var(--line);color:var(--muted)}
.lvl p{margin:0;color:var(--muted);font-size:.95rem}
.mini{display:flex;gap:2px}
.mini svg{width:20px;height:20px}
.quiz{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;max-width:780px}
.qtop{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:8px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.passage{background:var(--cb);border-radius:12px;padding:12px 14px;margin-bottom:12px;white-space:pre-line;max-width:68ch}
.q{font-size:1.28rem;font-weight:800;margin:0 0 14px;white-space:pre-line}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;font-size:1.06rem}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{background:var(--goodbg);border-color:var(--good)}
.opt.no{background:var(--badbg);border-color:var(--red)}
.opt:disabled{cursor:default}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.inrow input{flex:1;min-width:140px;max-width:260px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.hint{margin-top:10px;background:var(--warnbg);border-radius:10px;padding:10px 12px;font-weight:600}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--goodbg)} .fb.no{background:var(--badbg)}
.fb strong{font-family:var(--display);font-size:1.15rem;display:block}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--red)}
.fb small{display:block;margin-top:6px;color:var(--muted)}
.qact{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.end{text-align:center;padding:10px}
.end .big{font-family:var(--display);font-size:3.2rem;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;line-height:1}
.end .st{display:flex;justify-content:center;gap:6px;margin:12px 0}
.end .st svg{width:44px;height:44px}
.unlock{background:var(--goodbg);border-radius:12px;padding:10px;font-weight:800;color:var(--good);margin-top:8px}
.say{border:none;background:var(--cb);border-radius:8px;padding:2px 8px;font-size:.85rem;font-weight:800}
.ptable td.p{font-weight:800;text-align:center}
.ptable td.g{background:var(--goodbg)} .ptable td.w{background:var(--warnbg)} .ptable td.b{background:var(--badbg)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.method div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.method h4{margin:0 0 4px;font-family:var(--display);font-size:1.1rem}
.method p{margin:0;color:var(--muted);font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:800;max-width:calc(100% - 32px);text-align:center;z-index:9}
.foot{margin-top:28px;color:var(--muted);font-size:.9rem}
@media (max-width:480px){.today{grid-template-columns:1fr 1fr;gap:8px}.today .tcard:last-child{grid-column:1/-1}.tcard{padding:10px 12px}.tcard .v{font-size:1.35rem}.install{flex-wrap:wrap;padding:12px}.install img{width:40px;height:40px}.logo{width:52px;height:52px}.q{font-size:1.15rem}.quiz{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

{id:"tv",name:"Tiếng Việt",b:"Tv",h:8,intro:"Đọc hiểu, từ và câu, chính tả, viết đoạn",
 lessons:[
 ["Từ chỉ sự vật, hoạt động, đặc điểm",`<ul><li><b>Từ chỉ sự vật</b>: người, con vật, đồ vật, cây cối. Ví dụ: cô giáo, con mèo, quyển vở.</li><li><b>Từ chỉ hoạt động</b>: việc làm, động tác. Ví dụ: đọc, chạy, quét nhà.</li><li><b>Từ chỉ đặc điểm</b>: màu sắc, hình dáng, tính nết. Ví dụ: xanh, tròn, chăm chỉ.</li></ul><div class="tip">Mẹo: hỏi “cái gì, con gì?” → sự vật; “làm gì?” → hoạt động; “thế nào?” → đặc điểm.</div>`,1],
 ["Các kiểu câu và dấu câu",`<ul><li><b>Câu kể</b>: kể, tả, giới thiệu. Kết thúc bằng dấu chấm.</li><li><b>Câu hỏi</b>: dùng để hỏi. Kết thúc bằng dấu chấm hỏi.</li><li><b>Câu cảm</b>: bộc lộ cảm xúc, thường có <i>ôi, chao ôi, quá</i>. Kết thúc bằng dấu chấm than.</li><li><b>Câu khiến</b>: nhờ, yêu cầu, đề nghị, thường có <i>hãy, đừng, nhé</i>.</li><li><b>Dấu phẩy</b> ngăn cách các từ cùng loại: Nhà em trồng cam, bưởi, nhãn.</li></ul>`,1],
 ["Chính tả dễ nhầm",`<ul><li><b>s / x</b>: sân trường, xinh xắn, sạch sẽ.</li><li><b>tr / ch</b>: trường học, quả chuối, trăng tròn.</li><li><b>r / d / gi</b>: cô giáo, rổ rá, dạy dỗ.</li><li><b>l / n</b>: nắng, lúa, nón lá.</li></ul><div class="tip">Tên riêng người, địa danh viết hoa: Nguyễn Văn Thành, Thái Nguyên.</div>`,1],
 ["Mẫu câu: Ai là gì? Ai làm gì? Ai thế nào?",`<ul><li><b>Ai là gì?</b> giới thiệu, nhận xét: Thành <u>là học sinh lớp 3</u>.</li><li><b>Ai làm gì?</b> kể hoạt động: Đàn chim <u>bay về tổ</u>.</li><li><b>Ai thế nào?</b> nêu đặc điểm: Bầu trời <u>trong xanh</u>.</li></ul><p>Bộ phận trả lời câu hỏi <b>Khi nào?</b> (sáng mai, hôm qua), <b>Ở đâu?</b> (ở sân trường), <b>Vì sao?</b> (vì trời mưa).</p>`,2],
 ["Biện pháp so sánh",`<p>So sánh là đặt hai sự vật cạnh nhau vì chúng giống nhau. Từ so sánh: <i>như, giống như, tựa như, là</i>.</p><ul><li>Mặt trăng tròn <b>như</b> quả bóng.</li><li>So sánh hơn kém: Con hơn cha là nhà có phúc.</li></ul>`,2],
 ["Từ cùng nghĩa, trái nghĩa, thành ngữ",`<ul><li><b>Cùng nghĩa</b>: chăm chỉ – siêng năng; to – lớn.</li><li><b>Trái nghĩa</b>: cao – thấp; nhanh – chậm.</li><li><b>Thành ngữ, tục ngữ</b>: <i>Uống nước nhớ nguồn</i> (biết ơn); <i>Lá lành đùm lá rách</i> (giúp đỡ nhau); <i>Có công mài sắt, có ngày nên kim</i> (kiên trì).</li></ul>`,2],
 ["Nâng cao: nhân hóa",`<p><b>Nhân hóa</b> là gọi hoặc tả con vật, đồ vật, cây cối bằng từ ngữ dùng cho người.</p><ul><li>Gọi như người: <i>ông</i> mặt trời, <i>chị</i> gió.</li><li>Tả như người: lũ chim <i>gọi nhau</i>, bông lúa <i>chào</i> gió.</li></ul><div class="tip">Nhân hóa làm câu văn gần gũi, sinh động như sự vật cũng có suy nghĩ, tình cảm.</div>`,3],
 ["Nâng cao: đọc hiểu một đoạn văn",`<ol><li>Đọc lướt để biết đoạn văn nói về ai, về cái gì.</li><li>Đọc kĩ câu hỏi, gạch chân từ khóa (ai, ở đâu, vì sao…).</li><li>Tìm lại câu có chứa câu trả lời trong bài.</li><li>Với câu hỏi “ý chính”, hỏi: cả đoạn muốn nói điều gì nhất?</li></ol>`,3],
 ["Nâng cao: viết đoạn văn hay",`<ul><li>Bố cục: câu mở đầu – 3 đến 5 câu chi tiết – câu kết nêu cảm nghĩ.</li><li>Dùng ít nhất một hình ảnh so sánh hoặc nhân hóa.</li><li>Dùng từ chỉ đặc điểm cụ thể (xanh mướt, thơm lừng) thay cho từ chung chung (đẹp, tốt).</li><li>Đọc lại, sửa lỗi chính tả, dấu câu.</li></ul>`,3],

 lessons:[
 ["Bảng nhân, bảng chia 2 đến 9",`<div class="tbl" id="multbl"></div><div class="tip">Chia là phép ngược của nhân: 6 × 7 = 42 nên 42 : 6 = 7 và 42 : 7 = 6.</div>`,1],
 ["Các số đến 10 000 và 100 000",`<ul><li>Số có 4 chữ số: <b>nghìn – trăm – chục – đơn vị</b>. 4 736 = 4 000 + 700 + 30 + 6.</li><li>Số có 5 chữ số thêm hàng <b>chục nghìn</b>: 52 318.</li><li>So sánh: số nhiều chữ số hơn thì lớn hơn; bằng nhau thì so từng hàng từ trái sang phải.</li><li>Làm tròn: chữ số bên phải từ 5 trở lên thì làm tròn lên.</li></ul>`,1],
 ["Đo lường, thời gian, tiền",`<div class="tbl"><table><tr><th>Đại lượng</th><th>Đổi đơn vị</th></tr><tr><td>Độ dài</td><td>1 m = 10 dm = 100 cm; 1 cm = 10 mm; 1 km = 1 000 m</td></tr><tr><td>Khối lượng</td><td>1 kg = 1 000 g</td></tr><tr><td>Dung tích</td><td>1 l = 1 000 ml</td></tr><tr><td>Thời gian</td><td>1 giờ = 60 phút; 1 tuần = 7 ngày; 1 năm = 12 tháng</td></tr><tr><td>Nhiệt độ</td><td>°C: nước đá tan 0 °C, nước sôi 100 °C</td></tr></table></div><p>Chữ số La Mã: I = 1, V = 5, X = 10 (IV = 4, IX = 9, XIV = 14, XX = 20).</p>`,1],
 ["Nhân, chia số lớn; phép chia có dư",`<ul><li>Nhân với số có một chữ số: nhân từ hàng đơn vị, có nhớ thì cộng vào hàng sau.</li><li>Chia: chia từ hàng cao nhất.</li><li>Phép chia có dư: 17 : 5 = 3 dư 2. <b>Số dư luôn bé hơn số chia.</b></li></ul>`,2],
 ["Biểu thức và tìm x",`<ul><li>Chỉ có + − (hoặc chỉ × :): tính từ trái sang phải.</li><li>Có cả + − và × :: <b>nhân chia trước, cộng trừ sau</b>. Có ngoặc: làm trong ngoặc trước.</li><li>Số hạng = tổng − số hạng kia. Thừa số = tích : thừa số kia. Số bị chia = thương × số chia.</li></ul>`,2],
 ["Hình học: chu vi, diện tích",`<ul><li>Chu vi hình chữ nhật = (dài + rộng) × 2. Chu vi hình vuông = cạnh × 4.</li><li>Diện tích hình chữ nhật = dài × rộng. Diện tích hình vuông = cạnh × cạnh (đơn vị cm²).</li><li>Hình tròn: đường kính = 2 × bán kính.</li></ul>`,2],
 ["Nâng cao: giải toán bằng sơ đồ đoạn thẳng",`<p>Vẽ mỗi số bằng một đoạn thẳng giúp “nhìn thấy” bài toán. Đây cũng là cách học Toán nổi tiếng của Singapore (mô hình thanh).</p><div class="ex"><h4>Ví dụ 1. Gấp lên nhiều lần</h4><p>Lan có 6 quyển vở, Hoa có gấp 3 lần Lan. Hoa có mấy quyển?</p>${svgGap}<p>Hoa có 3 đoạn bằng nhau, mỗi đoạn 6 quyển: 6 × 3 = <b>18 quyển</b>.</p></div><div class="ex"><h4>Ví dụ 2. Rút về đơn vị (2 bước)</h4><p>3 hộp bút có 24 chiếc. Hỏi 5 hộp như thế có bao nhiêu chiếc?</p>${svgUnit}<p>Bước 1: 1 hộp = 24 : 3 = 8 chiếc. Bước 2: 5 hộp = 8 × 5 = <b>40 chiếc</b>.</p></div>`,3],
 ["Nâng cao: bài toán trồng cây",`<p>Đoạn đường 20 m, trồng cây ở cả hai đầu, cây cách nhau 5 m.</p>${svgTree}<ul><li>Số khoảng cách = 20 : 5 = 4.</li><li>Trồng cả hai đầu: số cây = số khoảng + 1 = <b>5 cây</b>.</li><li>Không trồng hai đầu: số cây = số khoảng − 1.</li><li>Trồng quanh hồ (đường khép kín): số cây = số khoảng.</li></ul>`,3],
 ["Nâng cao: quy luật dãy số, tính nhanh, suy luận",`<ul><li><b>Dãy số</b>: tìm khoảng cách giữa hai số liền nhau (cộng đều, gấp đôi, tăng dần).</li><li><b>Tính nhanh</b>: nhóm các số tròn chục, tròn trăm: 37 + 48 + 63 = (37 + 63) + 48; 25 × 4 = 100.</li><li><b>Tìm số bị chia khi có dư</b>: số bị chia = thương × số chia + số dư.</li><li><b>Đi ngược</b>: “một số nhân 5 rồi cộng 7 được 42” → 42 − 7, rồi chia 5.</li><li><b>Tuổi</b>: hiệu số tuổi của hai người không bao giờ thay đổi.</li></ul>`,3],
 ]},
{id:"ta",name:"Tiếng Anh",b:"En",h:340,intro:"Từ vựng, mẫu câu, ngữ pháp nhỏ, đọc hiểu",en:true,
 lessons:[
 ["Ngữ pháp nhỏ: this/that, he/she, is/are",`<ul><li><b>This is</b> (gần), <b>That is</b> (xa). <b>These are</b>, <b>Those are</b> cho nhiều vật.</li><li><b>He</b> cho con trai, đàn ông; <b>She</b> cho con gái, phụ nữ; <b>It</b> cho con vật, đồ vật; <b>They</b> cho nhiều người/vật.</li><li>Một vật dùng <b>is</b>, nhiều vật dùng <b>are</b>: There is a cat. There are two cats.</li><li>Nhiều vật thường thêm <b>s</b>: pen → pens, book → books.</li></ul>`,2],
 ["Ngữ pháp nhỏ: my/your/his/her, can/can’t",`<ul><li>my (của tôi), your (của bạn), his (của anh ấy), her (của cô ấy).</li><li><b>can</b> + hoạt động: I can swim. I can’t dance.</li><li>Hỏi: Can you draw? – Yes, I can. / No, I can’t.</li></ul>`,2],
 ["Nâng cao: đọc hiểu đoạn văn ngắn",`<ol><li>Đọc to cả đoạn một lần, bấm “nghe” để nghe mẫu.</li><li>Tìm từ để hỏi: <b>What</b> (cái gì), <b>Who</b> (ai), <b>Where</b> (ở đâu), <b>How old</b> (mấy tuổi), <b>Why</b> (tại sao) → câu trả lời có <b>because</b>.</li><li>Tìm câu trong bài có chứa từ khóa của câu hỏi.</li></ol>`,3],
 ],

{id:"dd",name:"Đạo đức",b:"Đđ",h:28,intro:"Yêu Tổ quốc, quan tâm mọi người, giữ lời hứa",
 lessons:[
 ["Chào cờ và hát Quốc ca",`<ul><li>Quốc kì: nền đỏ, sao vàng năm cánh.</li><li>Quốc ca: bài <b>Tiến quân ca</b> của nhạc sĩ Văn Cao.</li><li>Chào cờ: đứng nghiêm, bỏ mũ nón, nhìn Quốc kì, hát rõ ràng.</li></ul>`,1],
 ["Em yêu Tổ quốc Việt Nam",`<p>Việt Nam có nhiều cảnh đẹp (vịnh Hạ Long, Sa Pa, đồi chè Tân Cương…), con người cần cù, hiếu khách. Em thể hiện tình yêu Tổ quốc bằng việc học tốt, giữ gìn cảnh quan, giới thiệu quê hương.</p>`,1],
 ["Quan tâm hàng xóm láng giềng",`<ul><li>Chào hỏi lễ phép, giúp việc vừa sức.</li><li>Giữ trật tự vào giờ nghỉ trưa.</li></ul>`,1],
 ["Ham học hỏi, hoàn thành nhiệm vụ, giữ lời hứa",`<ul><li>Hay hỏi, tìm đọc sách, chú ý nghe giảng.</li><li>Nhận việc thì làm đến nơi đến chốn.</li><li>Đã hứa thì cố gắng thực hiện; không làm được thì báo trước và xin lỗi.</li></ul>`,2],
 ["Khám phá bản thân, xử lí bất hòa",`<ul><li>Biết điểm mạnh để phát huy, điểm yếu để sửa.</li><li>Khi bất hòa: bình tĩnh, lắng nghe, nói nhẹ nhàng, xin lỗi nếu sai, nhờ thầy cô khi cần.</li></ul>`,2],
 ["An toàn giao thông",`<ul><li>Đi bộ trên vỉa hè; qua đường ở vạch kẻ khi đèn xanh cho người đi bộ.</li><li>Đội mũ bảo hiểm khi ngồi xe máy.</li><li>Đèn đỏ dừng, đèn vàng chuẩn bị dừng, đèn xanh được đi.</li></ul>`,2],
 ["Nâng cao: suy nghĩ trước khi làm",`<p>Gặp tình huống khó, em tự hỏi 3 câu:</p><ol><li>Việc này có an toàn cho mình và người khác không?</li><li>Việc này có đúng, có trung thực không?</li><li>Nếu mọi người đều làm vậy thì điều gì xảy ra?</li></ol><div class="tip">Lời hứa làm việc sai thì không nên giữ. Hãy nói thật với người lớn.</div>`,3],
 ],

 ["Ngồi sau xe máy, em cần:","Đội mũ bảo hiểm, cài quai",["Không cần đội mũ","Đứng trên yên xe","Buông tay chơi"],"Mũ bảo hiểm bảo vệ đầu."],
 ["Việc nào thể hiện tình yêu quê hương?","Giữ gìn vệ sinh nơi công cộng",["Vẽ bậy lên tường","Xả rác xuống hồ","Bẻ cây ở công viên"],"Giữ gìn cảnh quan."],

 ],2:[
 ["Vì sao cần giữ lời hứa?","Để mọi người tin tưởng mình",["Để được thưởng","Để khỏi bị phạt","Vì bố mẹ bắt"],"Giữ lời hứa tạo niềm tin."],
 ["Ham học hỏi mang lại điều gì?","Hiểu biết nhiều hơn, học tiến bộ",["Mất thời gian","Bị bạn trêu","Không có lợi gì"],"Học hỏi giúp em giỏi lên."],
 ["Vì sao không nên làm ồn vào giờ nghỉ trưa?","Làm phiền hàng xóm nghỉ ngơi",["Vì sợ bị mắng","Vì trời nóng","Vì không có ai chơi"],"Tôn trọng người xung quanh."],
 ["Hành vi nào thể hiện tôn trọng Quốc kì?","Treo cờ ngay ngắn, không vẽ bậy lên cờ",["Dùng cờ lau bàn","Treo cờ ngược","Xé cờ làm đồ chơi"],"Quốc kì là biểu tượng của đất nước."],
 ["Biết điểm yếu của bản thân giúp em:","Tìm cách khắc phục để tiến bộ",["Buồn và bỏ cuộc","Đổ lỗi cho bạn","Giấu đi"],"Biết mình để sửa mình."],
 ["Đi đúng làn đường giúp:","Giảm tai nạn giao thông",["Đi nhanh hơn người khác","Không cần đèn","Tốn xăng hơn"],"Tuân thủ luật giữ an toàn."],
 ["Em hứa tưới cây cho cô nhưng hôm đó bị ốm. Em nên:","Nhờ bố mẹ báo cô và xin lỗi",["Im lặng","Nói dối là đã tưới","Đổ lỗi cho bạn"],"Không thực hiện được thì báo và xin lỗi."],
 ["Được giao nhiệm vụ khó, em nên:","Cố gắng, nhờ giúp khi cần, làm đến cùng",["Bỏ dở ngay","Đẩy cho bạn khác","Giả vờ quên"],"Tích cực hoàn thành nhiệm vụ."],
 ["Khi bạn làm em giận, việc đầu tiên nên làm là:","Bình tĩnh lại",["Đánh bạn","Hét lên","Nói xấu bạn"],"Bình tĩnh giúp xử lí tốt hơn."],
 ["Nhà hàng xóm đi vắng, trời sắp mưa mà quần áo còn phơi ngoài. Em nên:","Nhờ bố mẹ giúp cất quần áo",["Mặc kệ","Mang quần áo về nhà mình dùng","Ném vào sân"],"Quan tâm hàng xóm đúng cách."],
 ],3:[
 ["Bạn rủ em trốn học đi chơi điện tử và bảo “hứa không kể với ai”. Em nên:","Không đi, khuyên bạn và báo người lớn",["Đi cùng vì đã hứa","Đi nhưng về sớm","Không đi và cũng im lặng mãi"],"Lời hứa che giấu việc sai thì không nên giữ.","Việc bạn rủ có đúng không?"],
 ["Em hứa dự sinh nhật bạn nhưng hôm đó bà ốm nặng. Em nên:","Báo và xin lỗi bạn, ở nhà chăm bà",["Bỏ bà đi sinh nhật","Không báo gì","Hẹn bạn rồi không đến"],"Cân nhắc việc quan trọng hơn và nói rõ với bạn."],
 ["Hai bạn trong nhóm cãi nhau vì chia việc. Là nhóm trưởng, em nên:","Nghe cả hai bạn rồi chia việc công bằng",["Bênh bạn thân","Làm hết một mình","Mặc kệ"],"Lắng nghe và công bằng."],
 ["Em thấy các bạn đi xe đạp dàn hàng ba trên đường. Em nên:","Nhắc các bạn đi hàng một, sát lề phải",["Đi cùng hàng ba","Đua với các bạn","Cười các bạn"],"Nhắc nhở bạn tuân thủ an toàn."],
 ["Ngày Quốc khánh 2/9, gia đình em có thể làm gì?","Treo Quốc kì trước nhà",["Đốt pháo","Không làm gì","Treo cờ rách"],"Treo cờ thể hiện tình yêu Tổ quốc."],
 ["Em được giao vẽ tranh cho báo tường nhưng chưa vẽ đẹp. Cách tốt nhất:","Học hỏi bạn, thầy cô và cố gắng hoàn thành",["Từ chối ngay","Nhờ bố mẹ vẽ hộ toàn bộ","Nộp giấy trắng"],"Ham học hỏi và có trách nhiệm."],
 ["Em lỡ làm vỡ cốc nhà hàng xóm khi sang chơi. Em nên:","Nhận lỗi, xin lỗi và nói với bố mẹ",["Giấu mảnh vỡ","Đổ cho con mèo","Chạy về nhà"],"Trung thực và nhận lỗi."],
 ["Một bạn mới hay bị trêu vì nói giọng vùng khác. Em nên:","Chơi cùng bạn và nhắc các bạn khác tôn trọng",["Trêu theo","Tránh xa bạn","Cười to hơn"],"Tôn trọng sự khác biệt."],
 ]}},
{id:"tnxh",name:"Tự nhiên và Xã hội",b:"TN",h:140,intro:"Gia đình, trường học, cơ thể, thực vật, động vật, Trái Đất",
 lessons:[
 ["Gia đình: họ nội, họ ngoại, an toàn",`<ul><li><b>Họ nội</b>: bên bố (ông bà nội, cô, chú, bác). <b>Họ ngoại</b>: bên mẹ (ông bà ngoại, cậu, dì).</li><li>Phòng cháy: không nghịch lửa; khi có cháy gọi <b>114</b>.</li></ul>`,1],
 ["Thực vật",`<ul><li>Cây gồm <b>rễ, thân, lá</b>; nhiều cây có <b>hoa, quả</b>.</li><li>Rễ hút nước và muối khoáng. Thân nâng đỡ, vận chuyển nước và chất dinh dưỡng. Lá trao đổi khí, thoát hơi nước, tạo chất dinh dưỡng nhờ ánh sáng.</li></ul>`,1],
 ["Động vật",`<ul><li>Cơ thể: đầu, mình, cơ quan di chuyển (chân, cánh, vây).</li><li>Đẻ con (mèo, bò) hoặc đẻ trứng (gà, cá).</li><li>Có xương sống (cá, chim, thú) và không có xương sống (tôm, cua, giun).</li></ul>`,1],
 ["Con người và sức khỏe",`<div class="tbl"><table><tr><th>Cơ quan</th><th>Gồm</th><th>Chức năng</th></tr><tr><td>Tiêu hóa</td><td>miệng, thực quản, dạ dày, ruột non, ruột già, hậu môn</td><td>biến thức ăn thành chất bổ</td></tr><tr><td>Tuần hoàn</td><td>tim, mạch máu</td><td>đưa máu đi khắp cơ thể</td></tr><tr><td>Thần kinh</td><td>não, tủy sống, dây thần kinh</td><td>điều khiển mọi hoạt động</td></tr></table></div>`,2],
 ["Cộng đồng địa phương",`<p>Sản xuất nông nghiệp (trồng lúa, chè, chăn nuôi), công nghiệp (nhà máy), thủ công (đan lát, gốm). Sản phẩm phục vụ cuộc sống, cần sử dụng tiết kiệm.</p>`,2],
 ["Trái Đất và bầu trời",`<ul><li>Mặt Trời chiếu sáng, sưởi ấm Trái Đất. Mặt Trời mọc ở phía Đông, lặn ở phía Tây.</li><li>Trái Đất hình cầu, tự quay quanh mình nên có ngày và đêm.</li><li>5 đới khí hậu: 1 nhiệt đới, 2 ôn đới, 2 hàn đới. Việt Nam ở đới nóng.</li><li>Bề mặt: núi, đồi, cao nguyên, đồng bằng, sông, hồ, biển.</li></ul>`,2],
 ["Nâng cao: giải thích hiện tượng",`<ul><li><b>Vì sao buổi sáng bóng người đổ về phía Tây?</b> Mặt Trời ở phía Đông, bóng luôn ngược phía với ánh sáng.</li><li><b>Dơi, cá voi là thú</b> vì đẻ con và nuôi con bằng sữa, dù dơi biết bay và cá voi sống dưới nước.</li><li><b>Cây trong bóng tối lâu ngày</b> vàng lá, yếu vì lá không có ánh sáng để tạo chất dinh dưỡng.</li></ul><div class="tip">Cách học khoa học: quan sát → đặt câu hỏi “vì sao” → đoán → kiểm tra.</div>`,3],
 ],
 L:{1:[
 ["Ông bà bên bố gọi là:","Ông bà nội",["Ông bà ngoại","Cô dì","Hàng xóm"],"Họ nội là bên bố."],
 ["Anh trai của mẹ, em gọi là:","Cậu",["Chú","Bác","Dượng"],"Anh, em trai của mẹ là cậu."],
 ["Khi phát hiện cháy, em gọi số nào?","114",["113","115","111"],"114 cứu hỏa; 113 công an; 115 cấp cứu."],
 ["Bộ phận nào của cây hút nước và muối khoáng?","Rễ",["Lá","Hoa","Quả"],"Rễ hút nước từ đất."],
 ["Con vật nào đẻ trứng?","Con gà",["Con mèo","Con bò","Con chó"],"Gà đẻ trứng."],
 ["Con vật nào KHÔNG có xương sống?","Con tôm",["Con cá","Con chim","Con mèo"],"Tôm, cua, ốc, giun không có xương sống."],
 ["Cá di chuyển nhờ:","Vây và đuôi",["Cánh","Chân","Tay"],"Cá bơi bằng vây, đuôi."],
 ["Trái Đất có dạng hình gì?","Hình cầu",["Hình vuông","Hình tam giác","Phẳng như tờ giấy"],"Trái Đất hình cầu."],
 ["Vùng đất rộng, bằng phẳng, thường trồng lúa là:","Đồng bằng",["Núi","Đồi","Biển"],"Đồng bằng bằng phẳng."],
 ["Bộ phận nào giúp cây tạo chất dinh dưỡng nhờ ánh sáng?","Lá",["Rễ","Hạt","Gai"],"Lá dùng ánh sáng Mặt Trời."],
 ],2:[
 ["Tim và mạch máu thuộc cơ quan nào?","Tuần hoàn",["Tiêu hóa","Thần kinh","Hô hấp"],"Tim bơm máu qua mạch máu."],
 ["Dạ dày thuộc cơ quan nào?","Tiêu hóa",["Tuần hoàn","Thần kinh","Bài tiết"],"Dạ dày tiêu hóa thức ăn."],
 ["Chạm tay vào vật nóng, em rụt tay lại ngay. Cơ quan nào điều khiển?","Thần kinh",["Tiêu hóa","Tuần hoàn","Xương"],"Não và dây thần kinh điều khiển phản xạ."],
 ["Vì sao thân cây bị chặt đứt thì lá héo?","Nước không được vận chuyển lên lá",["Lá hết màu","Rễ mọc dài hơn","Hoa nở nhiều"],"Thân vận chuyển nước lên lá."],
 ["Cá thở bằng gì?","Mang",["Phổi","Da","Vây"],"Cá thở bằng mang."],
 ["Chim có đặc điểm chung nào?","Có lông vũ, mỏ, hai cánh, hai chân",["Có vảy và vây","Có bốn chân","Đẻ con"],"Đặc điểm chung của loài chim."],
 ["Tim đập nhanh hơn khi nào?","Khi chạy nhảy",["Khi ngủ","Khi ngồi yên","Khi đọc sách"],"Vận động mạnh cơ thể cần nhiều máu hơn."],
 ["Mặt Trời mọc ở hướng nào?","Đông",["Tây","Nam","Bắc"],"Mặt Trời mọc hướng Đông, lặn hướng Tây."],
 ["Vì sao có ngày và đêm?","Trái Đất tự quay quanh mình",["Mặt Trời tắt","Mặt Trăng che","Mây che"],"Nửa được chiếu sáng là ngày."],
 ["Hoạt động nào là sản xuất công nghiệp?","May quần áo ở nhà máy",["Cấy lúa","Nuôi gà","Hái chè"],"Nhà máy là sản xuất công nghiệp."],
 ],3:[
 ["Nếu Trái Đất không tự quay, điều gì xảy ra?","Một nửa luôn là ngày, nửa kia luôn là đêm",["Luôn luôn là ngày khắp nơi","Không có Mặt Trời","Không có mưa"],"Chỉ có nửa hướng về Mặt Trời được chiếu sáng.","Nghĩ về quả bóng được đèn chiếu một phía."],
 ["Buổi sáng, bóng của em đổ về phía nào?","Phía Tây",["Phía Đông","Phía Nam","Không có bóng"],"Mặt Trời ở phía Đông nên bóng đổ ngược lại.","Bóng luôn ngược phía với ánh sáng."],
 ["Dơi biết bay nhưng thuộc nhóm nào?","Thú",["Chim","Cá","Côn trùng"],"Dơi đẻ con, nuôi con bằng sữa.","Dơi đẻ trứng hay đẻ con?"],
 ["Cá voi sống dưới nước nhưng thuộc nhóm nào?","Thú",["Cá","Chim","Bò sát"],"Cá voi thở bằng phổi, đẻ con, nuôi con bằng sữa."],
 ["Chậu cây để trong phòng tối nhiều ngày sẽ thế nào?","Lá vàng, cây yếu dần",["Cây xanh tốt hơn","Cây ra nhiều hoa","Không thay đổi"],"Thiếu ánh sáng, lá không tạo được chất dinh dưỡng."],
 ["Vì sao đồng bằng Việt Nam gần như không có tuyết rơi?","Vì Việt Nam ở đới nóng",["Vì gần Mặt Trăng","Vì nhiều sông","Vì ít người"],"Đới nóng quanh năm ấm áp."],
 ["Để cơ quan thần kinh khỏe, em nên:","Ngủ đủ giấc, không xem điện thoại khuya",["Thức khuya xem phim","Chơi điện tử nhiều giờ","Bỏ bữa sáng"],"Não cần nghỉ ngơi đầy đủ."],
 ["Vì sao nên nhai kĩ khi ăn?","Giúp dạ dày tiêu hóa dễ hơn",["Để ăn lâu hơn","Để răng mỏi","Không có tác dụng"],"Thức ăn nhỏ, mềm thì dễ tiêu hóa."],
 ]}},
{id:"tin",name:"Tin học",b:"Th",h:190,intro:"Máy tính, chuột, bàn phím, tư duy máy tính, an toàn mạng",
 lessons:[
 ["Máy tính và các bộ phận",`<ul><li>Thân máy, màn hình, bàn phím, chuột.</li><li>Ngồi thẳng lưng, mắt cách màn hình 50–80 cm.</li></ul>`,1],
 ["Sử dụng chuột",`<ul><li><b>Nháy chuột</b>: nhấn nút trái một lần. <b>Nháy đúp</b>: hai lần nhanh. <b>Nháy nút phải</b>: mở bảng chọn. <b>Kéo thả</b>: giữ nút trái, di chuột rồi thả.</li></ul>`,1],
 ["Gõ bàn phím",`<p>Hàng phím cơ sở: <b>A S D F G H J K L</b>. Phím <b>F</b> và <b>J</b> có gờ để đặt ngón trỏ. Bấm thử:</p><div class="keys" id="keys"></div><p>Phím <b>Space</b> (cách) tạo khoảng trống, <b>Enter</b> xuống dòng, <b>Backspace</b> xóa chữ bên trái con trỏ.</p>`,2],
 ["Thông tin, thư mục, an toàn mạng",`<ul><li>Thông tin nhận qua mắt, tai… rồi quyết định: thấy đèn đỏ → dừng.</li><li>Tệp cất trong <b>thư mục</b>; thư mục trong thư mục gọi là <b>thư mục con</b>, tạo thành cây thư mục.</li><li>Không cho người lạ biết tên, địa chỉ, mật khẩu. Không bấm đường link lạ.</li></ul>`,2],
 ["Nâng cao: tư duy như máy tính",`<p>Máy tính làm theo từng bước lệnh rất rõ ràng gọi là <b>thuật toán</b>.</p><ul><li>Chia việc lớn thành bước nhỏ: đánh răng = lấy bàn chải → lấy kem → chải răng → súc miệng → rửa bàn chải.</li><li>Thứ tự quan trọng: làm sai thứ tự thì kết quả sai.</li><li>Lặp lại: “tiến 1 ô” làm 3 lần = “tiến 3 ô”.</li></ul>`,3],
 ],
 L:{1:[
 ["Bộ phận nào hiển thị kết quả làm việc của máy tính?","Màn hình",["Chuột","Bàn phím","Loa"],"Màn hình hiển thị hình, chữ."],
 ["Nhấn nhanh nút trái chuột hai lần gọi là:","Nháy đúp chuột",["Nháy chuột","Kéo thả","Nháy nút phải"],"Hai lần liên tiếp là nháy đúp."],
 ["Giữ nút trái, di chuột rồi thả tay gọi là:","Kéo thả",["Nháy đúp","Nháy chuột","Cuộn chuột"],"Đó là kéo thả."],
 ["Hai phím nào có gờ để đặt ngón trỏ?","F và J",["A và L","D và K","G và H"],"F và J có gờ."],
 ["Mắt nên cách màn hình khoảng:","50 – 80 cm",["5 cm","10 cm","3 m"],"Bảo vệ mắt."],
 ["Người lạ trên mạng hỏi địa chỉ nhà em. Em nên:","Không trả lời và báo bố mẹ",["Nói địa chỉ","Gửi ảnh nhà","Hẹn gặp"],"Không cho người lạ thông tin cá nhân."],
 ["Nơi cất các tệp trên máy tính gọi là:","Thư mục",["Màn hình","Bàn phím","Loa"],"Tệp cất trong thư mục."],
 ["Dùng bàn phím, chuột để:","Đưa lệnh, dữ liệu vào máy tính",["Phát ra âm thanh","In ra giấy","Làm mát máy"],"Thiết bị vào."],
 ["Hàng phím cơ sở gồm:","A S D F G H J K L",["Q W E R T Y","Z X C V B N M","1 2 3 4 5"],"Hàng phím giữa."],
 ["Thấy đèn đỏ thì dừng lại. “Đèn đỏ” là:","Thông tin",["Máy tính","Thư mục","Con chuột"],"Nhận thông tin qua mắt."],
 ],2:[
 ["Phím nào dùng để tạo khoảng trống giữa hai chữ?","Space (phím cách)",["Enter","Backspace","Shift"],"Phím dài nhất là phím cách."],
 ["Phím nào dùng để xuống dòng?","Enter",["Space","Backspace","Ctrl"],"Enter xuống dòng mới."],
 ["Phím nào xóa chữ ở bên trái con trỏ?","Backspace",["Enter","Space","Tab"],"Backspace xóa lùi."],
 ["Muốn mở một thư mục, em thường làm gì?","Nháy đúp chuột vào thư mục",["Nháy nút phải một lần","Gõ phím Space","Tắt máy"],"Nháy đúp để mở."],
 ["Mật khẩu tốt là mật khẩu:","Khó đoán và không cho ai biết",["Là tên của em","Là 123456","Dán lên màn hình"],"Giữ bí mật mật khẩu."],
 ["Thông tin nào nhận bằng tai?","Tiếng trống trường",["Màu cờ","Mùi hoa","Vị ngọt của kẹo"],"Âm thanh nhận bằng tai."],
 ["Thư mục “Học tập” chứa thư mục “Toán”. “Toán” là:","Thư mục con của “Học tập”",["Thư mục mẹ của “Học tập”","Một tệp ảnh","Một phím"],"Thư mục nằm trong thư mục khác là thư mục con."],
 ["Xem nội dung trên mạng làm em sợ hãi. Em nên:","Tắt đi và kể với bố mẹ, thầy cô",["Xem tiếp","Gửi cho bạn","Giấu mọi người"],"Báo người lớn để được giúp."],
 ["Sắp xếp sách theo thứ tự giúp:","Tìm sách nhanh hơn",["Sách nặng hơn","Sách đẹp hơn","Đọc chậm hơn"],"Sắp xếp giúp tìm kiếm."],
 ["Muốn mở bảng chọn thêm các lệnh, em:","Nháy nút phải chuột",["Nháy đúp","Kéo thả","Nhấn Enter hai lần"],"Nháy phải mở bảng chọn."],
 ],3:[
 ["Thứ tự đúng khi đánh răng là:","Lấy kem → chải răng → súc miệng",["Súc miệng → lấy kem → cất bàn chải","Chải răng → lấy kem → súc miệng","Cất bàn chải → chải răng → lấy kem"],"Các bước phải đúng thứ tự mới có kết quả đúng.","Việc nào phải làm trước tiên?"],
 ["Robot đứng ở ô số 1. Lệnh: tiến 3 ô, lùi 1 ô. Robot ở ô số mấy?","Ô số 3",["Ô số 4","Ô số 5","Ô số 2"],"1 + 3 = 4, lùi 1 còn 3.","Làm từng lệnh một."],
 ["Lệnh “tiến 1 ô” lặp lại 4 lần giống lệnh nào?","Tiến 4 ô",["Tiến 1 ô","Lùi 4 ô","Quay trái"],"Lặp lại 4 lần mỗi lần 1 ô."],
 ["Một người trên mạng nói là bạn cùng lớp và xin mật khẩu của em. Em nên:","Không cho và hỏi bố mẹ",["Cho ngay vì là bạn","Cho một nửa mật khẩu","Đổi mật khẩu rồi cho"],"Không ai cần biết mật khẩu của em, kể cả bạn."],
 ["Máy tính làm việc được là nhờ:","Làm theo các lệnh con người viết sẵn",["Tự nghĩ như người","Có phép thuật","Ăn điện là đủ"],"Máy tính thực hiện chương trình."],
 ["Để tìm nhanh một tệp ảnh chụp ngày sinh nhật, cách cất tốt nhất là:","Cất trong thư mục đặt tên rõ “Sinh nhật”",["Để lung tung ngoài màn hình","Đặt tên tệp là “aaa”","Xóa đi"],"Đặt tên rõ ràng, sắp xếp gọn gàng."],
 ["Em dùng máy tính 30 phút. Em nên làm gì tiếp theo?","Nghỉ, nhìn ra xa cho mắt thư giãn",["Dùng thêm 3 tiếng","Dí mắt sát màn hình","Tắt đèn phòng"],"Nghỉ ngơi bảo vệ mắt."],
 ["Chia việc “dọn cặp sách” thành bước nhỏ, bước đầu tiên hợp lí là:","Xem thời khóa biểu ngày mai",["Kéo khóa cặp","Đeo cặp đi học","Bỏ bút vào"],"Cần biết mai học môn gì trước."],
 ]}},
{id:"cn",name:"Công nghệ",b:"Cn",h:255,intro:"Đèn học, quạt, radio, tivi, biển báo, làm đồ dùng",
 lessons:[
 ["Tự nhiên và công nghệ",`<p><b>Đối tượng tự nhiên</b> có sẵn: cây, sông, núi. <b>Sản phẩm công nghệ</b> do con người làm ra: quạt, xe đạp, tivi.</p>`,1],
 ["Đèn học và quạt điện",`<ul><li>Đèn học: đế, thân, chụp đèn, bóng đèn, công tắc, dây nguồn. Chiếu vào trang sách, không chiếu vào mắt.</li><li>Quạt: cánh, lồng, động cơ, thân, đế, nút điều khiển. Không cho tay vào lồng quạt.</li></ul>`,1],
 ["Máy thu thanh và máy thu hình",`<ul><li><b>Radio</b> phát âm thanh (Đài Tiếng nói Việt Nam – VOV).</li><li><b>Tivi</b> phát hình ảnh và âm thanh (Đài Truyền hình Việt Nam – VTV).</li></ul>`,2],
 ["An toàn điện và biển báo",`<ul><li>Không chạm tay ướt vào ổ điện. Dây hở: tránh xa, báo người lớn.</li><li>Biển báo <b>tròn viền đỏ</b>: cấm. <b>Tam giác viền đỏ nền vàng</b>: nguy hiểm, cảnh báo. <b>Tròn nền xanh</b>: hiệu lệnh (phải làm theo).</li></ul>`,2],
 ["Nâng cao: quy trình làm một sản phẩm",`<ol><li><b>Ý tưởng</b>: làm gì, để làm gì (ống bút từ hộp sữa).</li><li><b>Chuẩn bị</b>: vật liệu, dụng cụ, làm sạch vật liệu.</li><li><b>Đo – vẽ – cắt – dán</b> cẩn thận.</li><li><b>Thử và sửa</b>: dùng thử, thấy chưa chắc thì dán lại.</li><li><b>Trang trí và dọn dẹp</b>.</li></ol><div class="tip">Kĩ sư cũng làm theo các bước này: nghĩ – làm – thử – sửa.</div>`,3],
 ],
 L:{1:[
 ["Đâu là sản phẩm công nghệ?","Quạt điện",["Cây bàng","Dòng sông","Con mèo"],"Do con người làm ra."],
 ["Đâu là đối tượng tự nhiên?","Ngọn núi",["Ti vi","Xe đạp","Bút chì"],"Có sẵn trong tự nhiên."],
 ["Bộ phận nào của đèn học dùng để bật, tắt?","Công tắc",["Chụp đèn","Đế đèn","Thân đèn"],"Công tắc bật tắt."],
 ["Bộ phận nào của quạt tạo ra gió?","Cánh quạt",["Đế quạt","Dây điện","Nút bấm"],"Cánh quay tạo gió."],
 ["Việc nào nguy hiểm khi dùng quạt?","Cho ngón tay vào lồng quạt",["Chọn tốc độ vừa","Tắt quạt khi ra ngoài","Đặt quạt chắc chắn"],"Dễ bị thương."],
 ["Radio phát ra:","Âm thanh",["Hình ảnh","Ánh sáng","Gió"],"Radio chỉ có tiếng."],
 ["Tivi phát ra:","Hình ảnh và âm thanh",["Chỉ âm thanh","Chỉ ánh sáng","Gió mát"],"Có hình và tiếng."],
 ["Tay đang ướt, có nên cắm phích điện?","Không, lau khô tay trước",["Có","Có, cắm thật nhanh","Nhờ em nhỏ cắm"],"Nước dẫn điện."],
 ["Thấy dây điện hở trong nhà, em nên:","Tránh xa và báo người lớn",["Lấy tay quấn lại","Kéo đứt dây","Đổ nước vào"],"Rất nguy hiểm."],
 ["Khi dùng kéo cắt giấy, em cần:","Cầm cẩn thận, không chĩa vào bạn",["Vừa cắt vừa đùa","Ném kéo cho bạn","Cắt tóc bạn"],"Dùng dụng cụ an toàn."],
 ],2:[
 ["Chụp đèn có tác dụng gì?","Tập trung ánh sáng, đỡ chói mắt",["Làm đèn nặng hơn","Tạo gió","Phát nhạc"],"Chụp đèn hướng ánh sáng xuống."],
 ["Các nút số 1, 2, 3 trên quạt dùng để:","Chỉnh tốc độ gió",["Hẹn giờ báo thức","Đổi màu quạt","Bật đèn"],"Số càng lớn gió càng mạnh."],
 ["Vì sao nên tắt tivi khi không xem?","Tiết kiệm điện, bảo vệ mắt",["Để tivi nóng lên","Để tivi to hơn","Không cần thiết"],"Tránh lãng phí."],
 ["Đài Truyền hình Việt Nam viết tắt là:","VTV",["VOV","VNA","VTC"],"VOV là Đài Tiếng nói Việt Nam."],
 ["Biển báo hình tròn, viền đỏ có ý nghĩa:","Cấm",["Chỉ dẫn","Hiệu lệnh","Khu vui chơi"],"Viền đỏ tròn là biển cấm."],
 ["Biển tam giác viền đỏ nền vàng có ý nghĩa:","Cảnh báo nguy hiểm",["Cấm","Hiệu lệnh","Chỉ đường"],"Nhắc chú ý phía trước."],
 ["Biển tròn nền xanh có ý nghĩa:","Hiệu lệnh phải làm theo",["Cấm","Nguy hiểm","Quảng cáo"],"Biển xanh tròn là hiệu lệnh."],
 ["Xem tivi đúng cách là:","Ngồi xa, xem đúng giờ, chương trình hợp lứa tuổi",["Ngồi sát màn hình","Xem cả đêm","Vừa ăn vừa xem thật lâu"],"Bảo vệ mắt và sức khỏe."],
 ["Nên chọn vật liệu nào để làm ống bút?","Vỏ hộp sữa giấy đã rửa sạch",["Mảnh thủy tinh","Hộp đựng thuốc","Túi ni lông rách"],"Vật liệu an toàn, tái chế."],
 ],3:[
 ["Quạt đang chạy bỗng kêu lạ và có mùi khét. Em nên:","Báo ngay người lớn tắt điện, không tự sửa",["Tự tháo quạt ra xem","Đổ nước làm mát","Để quạt chạy tiếp"],"Có dấu hiệu chập điện, cần người lớn xử lí.","Mùi khét là dấu hiệu gì?"],
 ["Bật công tắc nhưng đèn học không sáng. Nguyên nhân có thể là:","Chưa cắm phích điện",["Chụp đèn màu xanh","Bàn học thấp","Trời đang sáng"],"Kiểm tra nguồn điện trước tiên."],
 ["Làm ống bút từ vỏ hộp sữa, bước đầu tiên là:","Rửa sạch, lau khô hộp",["Trang trí","Cắm bút vào","Dán nhãn tên"],"Chuẩn bị vật liệu sạch trước."],
 ["Biển báo tam giác vàng có hình hai trẻ em cho biết:","Phía trước có trường học, trẻ em qua đường",["Khu vui chơi miễn phí","Cấm trẻ em","Bến xe buýt"],"Người lái xe cần đi chậm."],
 ["Sau khi làm xong đồ chơi, dùng thử thấy bánh xe lỏng. Em nên:","Dán, gắn lại cho chắc rồi thử lại",["Vứt đi","Để nguyên","Cho bạn"],"Thử và sửa là một bước của quy trình."],
 ["Ổ điện thấp trong nhà có em bé. Cách an toàn là:","Dùng nắp che ổ điện",["Để bé tự chơi","Cắm kéo vào","Đổ nước lên"],"Che ổ điện tránh trẻ nhỏ chạm vào."],
 ["Vì sao nói xe đạp là sản phẩm công nghệ?","Vì do con người thiết kế và làm ra",["Vì có hai bánh","Vì màu đẹp","Vì có sẵn trong tự nhiên"],"Sản phẩm công nghệ do con người tạo ra."],
 ]}},
{id:"an",name:"Âm nhạc",b:"♪",h:285,intro:"Nốt nhạc, khuông nhạc, trường độ, nhạc cụ",
 lessons:[
 ["Bảy nốt nhạc",`<p><b>Đô – Rê – Mi – Pha – Son – La – Si</b>. Bấm để nghe:</p><div class="keys" id="notes"></div>`,1],
 ["Nhạc cụ gõ và cách hát",`<p>Thanh phách, song loan, trống con, tambourine, triangle. Hát: đứng thẳng, lấy hơi nhẹ, hát rõ lời. Quốc ca: Tiến quân ca (Văn Cao).</p>`,1],
 ["Khuông nhạc và khóa Son",`<ul><li>5 dòng kẻ, 4 khe, đếm từ dưới lên.</li><li>Khóa Son ở đầu khuông: nốt <b>Son</b> ở dòng 2.</li><li>Dòng 1: <b>Mi</b>, dòng 3: <b>Si</b>. Khe 1: <b>Pha</b>, khe 2: <b>La</b>. Nốt <b>Đô</b> nằm trên dòng kẻ phụ phía dưới.</li></ul>`,2],
 ["Hình nốt, nhịp 2/4",`<ul><li>Nốt trắng = 2 nốt đen. Nốt đen = 2 nốt móc đơn.</li><li>Dấu lặng: chỗ ngừng không hát.</li><li>Nhịp 2/4: mỗi ô nhịp 2 phách, phách 1 mạnh, phách 2 nhẹ.</li></ul>`,2],
 ["Nâng cao: tính trường độ",`<p>Coi nốt đen = 1 phách: nốt trắng = 2 phách, móc đơn = nửa phách.</p><ul><li>1 nốt trắng = 4 nốt móc đơn.</li><li>1 nốt trắng + 1 nốt đen = 3 phách = 6 nốt móc đơn.</li><li>Ô nhịp 2/4 có thể là: 1 nốt trắng; hoặc 2 nốt đen; hoặc 1 nốt đen + 2 móc đơn.</li></ul>`,3],
 ],
 L:{1:[
 ["Có bao nhiêu nốt nhạc cơ bản?","7 nốt",["5 nốt","6 nốt","8 nốt"],"Đô, Rê, Mi, Pha, Son, La, Si."],
 ["Nốt nào đứng sau nốt Mi?","Pha",["Rê","Son","La"],"Đô – Rê – Mi – Pha…"],
 ["Nhạc cụ nào là nhạc cụ gõ?","Thanh phách",["Sáo trúc","Đàn bầu","Kèn"],"Thanh phách gõ vào nhau."],
 ["Ai sáng tác bài Tiến quân ca?","Nhạc sĩ Văn Cao",["Nhạc sĩ Phạm Tuyên","Nhạc sĩ Hoàng Long","Nhạc sĩ Trần Tiến"],"Văn Cao."],
 ["Khi hát, em nên:","Đứng thẳng, hát rõ lời",["Hét hết sức","Vừa hát vừa ăn","Cúi gập người"],"Tư thế đúng giúp hát hay."],
 ["Khuông nhạc có mấy dòng kẻ?","5",["4","6","3"],"5 dòng kẻ, 4 khe."],
 ["Nốt đứng trước nốt La là:","Son",["Si","Pha","Mi"],"…Son – La – Si."],
 ["Dấu lặng có nghĩa là:","Ngừng, không hát",["Hát to lên","Hát nhanh hơn","Hát lại từ đầu"],"Chỗ nghỉ."],
 ],2:[
 ["Nốt trắng dài bằng mấy nốt đen?","2",["1","3","4"],"1 nốt trắng = 2 nốt đen."],
 ["Nốt đen dài bằng mấy nốt móc đơn?","2",["1","4","3"],"1 nốt đen = 2 móc đơn."],
 ["Nhịp 2/4 có mấy phách trong một ô nhịp?","2",["3","4","1"],"Số 2 trên cho biết 2 phách."],
 ["Với khóa Son, nốt Son nằm ở đâu?","Dòng kẻ thứ 2",["Dòng kẻ thứ 1","Khe thứ 3","Dòng kẻ thứ 5"],"Khóa Son quấn quanh dòng 2."],
 ["Nốt nào cao nhất?","Si",["Đô","Mi","Son"],"Càng về cuối dãy càng cao."],
 ["Nhạc cụ dân tộc chỉ có một dây là:","Đàn bầu",["Đàn nguyệt","Đàn tranh","Trống"],"Đàn bầu một dây."],
 ["Sáo trúc là nhạc cụ:","Thổi",["Gõ","Kéo","Gảy"],"Thổi hơi để phát tiếng."],
 ["Bài hát vui tươi nên hát:","Rộn ràng, tươi sáng",["Buồn, chậm rãi","Thì thầm","Rất nhỏ"],"Thể hiện đúng tính chất bài."],
 ["Gõ đệm theo phách nghĩa là:","Mỗi phách gõ một tiếng đều nhau",["Gõ lung tung","Gõ thật nhanh","Chỉ gõ cuối bài"],"Đệm theo phách giữ nhịp đều."],
 ],3:[
 ["1 nốt trắng dài bằng mấy nốt móc đơn?","4",["2","3","8"],"Trắng = 2 đen = 4 móc đơn.","Đổi nốt trắng ra nốt đen trước."],
 ["1 nốt trắng + 1 nốt đen dài bằng mấy nốt móc đơn?","6",["3","4","5"],"Trắng = 4 móc đơn, đen = 2 móc đơn, cộng lại 6.","Đổi từng nốt ra móc đơn rồi cộng."],
 ["Ô nhịp 2/4 nào đúng?","1 nốt đen + 2 nốt móc đơn",["2 nốt trắng","3 nốt đen","1 nốt trắng + 1 nốt đen"],"Đen (1 phách) + 2 móc đơn (1 phách) = 2 phách.","Mỗi ô nhịp 2/4 đủ đúng 2 phách."],
 ["Với khóa Son, nốt nằm ở dòng kẻ thứ 1 là:","Mi",["Đô","Son","Pha"],"Dòng 1 là Mi, dòng 2 là Son."],
 ["Với khóa Son, nốt nằm ở khe thứ 2 là:","La",["Pha","Đô","Si"],"Khe 1 Pha, khe 2 La."],
 ["Nốt Đô (thấp) nằm ở đâu trên khuông nhạc khóa Son?","Dòng kẻ phụ bên dưới",["Dòng kẻ thứ 3","Khe thứ 4","Đầu khuông"],"Đô nằm dưới khuông, cần thêm dòng kẻ phụ."],
 ["Bấm lần lượt Đô – Mi – Son sẽ nghe thấy:","Âm thanh đi lên dần",["Âm thanh đi xuống","Ba âm giống nhau","Không có âm"],"Đô thấp hơn Mi, Mi thấp hơn Son."],
 ]}},
{id:"mt",name:"Mĩ thuật",b:"Mt",h:25,intro:"Màu sắc, đường nét, hình khối, bố cục",
 lessons:[
 ["Màu cơ bản và màu pha",`<p>Ba <b>màu cơ bản</b>: đỏ, vàng, lam. Chọn hai màu để pha thử:</p><div class="mix" id="mix"></div><ul><li>Đỏ + Vàng = Cam</li><li>Vàng + Lam = Xanh lá</li><li>Đỏ + Lam = Tím</li></ul>`,1],
 ["Đường nét, hình và khối",`<ul><li>Nét thẳng, cong, gấp khúc, lượn sóng.</li><li><b>Hình</b> phẳng (tròn, vuông, tam giác). <b>Khối</b> có chiều dày (cầu, hộp, trụ, nón).</li></ul>`,1],
 ["Màu nóng, màu lạnh, đậm nhạt",`<ul><li><b>Màu nóng</b>: đỏ, cam, vàng (ấm áp). <b>Màu lạnh</b>: lam, xanh lá, tím (mát mẻ).</li><li>Thêm trắng thì màu nhạt hơn; thêm đen thì màu đậm hơn.</li><li>Vật ở gần vẽ to, rõ; vật ở xa vẽ nhỏ, mờ.</li></ul>`,2],
 ["Nâng cao: màu tương phản và bố cục",`<ul><li><b>Cặp màu bổ túc</b> đặt cạnh nhau làm nhau nổi bật: đỏ – xanh lá, vàng – tím, lam – cam.</li><li>Hình chính sáng trên nền tối (hoặc ngược lại) sẽ nổi bật.</li><li>Bố cục: hình chính to, rõ, gần giữa; hình phụ nhỏ hơn xung quanh; vẽ kín tờ giấy.</li><li>Tái chế: nắp chai, hộp giấy, lõi giấy có thể làm tranh ghép, đồ chơi.</li></ul>`,3],
 ],
 L:{1:[
 ["Ba màu cơ bản là:","Đỏ, vàng, lam",["Đỏ, cam, tím","Xanh lá, tím, hồng","Đen, trắng, xám"],"Đỏ, vàng, lam."],
 ["Pha đỏ với vàng được:","Màu cam",["Màu tím","Màu xanh lá","Màu nâu"],"Đỏ + vàng = cam."],
 ["Pha vàng với lam được:","Màu xanh lá",["Màu cam","Màu tím","Màu hồng"],"Vàng + lam = xanh lá."],
 ["Pha đỏ với lam được:","Màu tím",["Màu cam","Màu xanh lá","Màu vàng"],"Đỏ + lam = tím."],
 ["Quả bóng có dạng khối gì?","Khối cầu",["Khối hộp","Khối trụ","Khối nón"],"Tròn đều là khối cầu."],
 ["Hộp sữa giấy có dạng khối gì?","Khối hộp",["Khối cầu","Khối nón","Khối trụ"],"Có các mặt phẳng."],
 ["Chiếc nón lá có dạng khối gì?","Khối nón",["Khối hộp","Khối cầu","Khối trụ"],"Đỉnh nhọn, đáy tròn."],
 ["Nét như sóng biển gọi là:","Nét lượn sóng",["Nét thẳng","Nét gấp khúc","Nét chấm"],"Uốn lên xuống đều."],
 ["Sau khi vẽ màu nước, em nên:","Rửa cọ và cất gọn đồ dùng",["Để cọ khô nguyên màu","Vứt cọ đi","Đổ màu ra bàn"],"Giữ gìn đồ dùng."],
 ],2:[
 ["Màu nào là màu nóng?","Đỏ",["Lam","Xanh lá","Tím"],"Đỏ, cam, vàng là màu nóng."],
 ["Màu nào là màu lạnh?","Xanh lam",["Cam","Đỏ","Vàng"],"Lam, xanh lá, tím là màu lạnh."],
 ["Tranh “Mùa hè rực nắng” nên dùng nhiều:","Màu nóng",["Màu lạnh","Màu đen","Màu xám"],"Màu nóng gợi nắng, ấm."],
 ["Tranh “Biển xanh mát” nên dùng nhiều:","Màu lạnh",["Màu nóng","Màu nâu","Màu đen"],"Màu lạnh gợi mát mẻ."],
 ["Màu tím pha thêm trắng sẽ thành:","Tím nhạt hơn",["Tím đậm hơn","Màu vàng","Màu đỏ"],"Thêm trắng thì nhạt hơn."],

/* ---------- BỘ TỰ SINH CÂU HỎI (mọi môn) ---------- */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mk=(q,a,w,e,h,p)=>({q,o:[a].concat([...new Set(w)].filter(x=>x!==a).slice(0,3)),e:e||"",h:h||"",p:p||""});
const pickN=(arr,n,ex)=>shuffle([...new Set(arr)].filter(x=>!(ex||[]).includes(x))).slice(0,n);
function cls(groups,t,q,ef){const a=pick(groups[t]);const others=Object.keys(groups).filter(k=>k!==t).flatMap(k=>groups[k]);return mk(q,a,pickN(others,3),ef?ef(a,t):`“${cap(a)}” thuộc nhóm: ${t}.`)}
function which(groups,qf,ef){const ks=Object.keys(groups);const k=pick(ks);const it=pick(groups[k]);return mk(qf(it),k,pickN(ks,3,[k]),ef?ef(it,k):`${cap(it)} → ${k}.`)}
function pairQ(pairs,qa,qb,ef){const pr=pick(pairs);const[a,b]=pr;const e=ef?ef(a,b):`${cap(a)}: ${b}.`;
 if(!qb||Math.random()<.5)return mk(qa(a),b,pickN(pairs.map(p=>p[1]),3,[b]),e);
 return mk(qb(b),a,pickN(pairs.map(p=>p[0]),3,[a]),e)}
function countGood(good,bad,q){const n=R(0,4);const items=shuffle(pickN(good,n).concat(pickN(bad,4-n)));const g=items.filter(x=>good.includes(x));
 return mk(`${q}\n`+items.map((x,i)=>`${i+1}. ${cap(x)}`).join("\n"),`${n} việc`,shuffle([0,1,2,3,4].filter(x=>x!==n)).slice(0,3).map(x=>`${x} việc`),g.length?`Việc nên làm: ${g.join("; ")}.`:"Không có việc nào nên làm.","Đọc từng việc và tự hỏi: việc này đúng hay sai?")}
function gb(good,bad){return{1:[()=>cls({a:good,b:bad},"a","Việc làm nào đúng, nên làm?",a=>`“${cap(a)}” là việc nên làm.`)],2:[()=>cls({a:good,b:bad},"b","Việc làm nào chưa đúng, cần tránh?",a=>`“${cap(a)}” là việc cần tránh.`)],3:[()=>countGood(good,bad,"Trong các việc sau, có mấy việc nên làm?")]}}
function seqQ(tasks){const[n,st]=pick(tasks);const i=R(0,st.length-1);return mk(`Để ${n}, bước thứ ${i+1} là gì?`,st[i],st.filter((_,k)=>k!==i),`Thứ tự đúng: ${st.join(" → ")}.`,"Nghĩ xem việc nào phải làm trước.")}
function nextQ(tasks){const[n,st]=pick(tasks);const i=R(0,st.length-2);return mk(`Khi ${n}, việc làm ngay sau “${st[i]}” là:`,st[i+1],st.filter((_,k)=>k!==i+1),`Thứ tự đúng: ${st.join(" → ")}.`)}

const fromArr=b=>({q:b[0],o:[b[1]].concat(b[2]),e:b[3],h:b[4]||"",p:b[5]||""});

S.seen=S.seen||{};
const qkey=q=>q.q+"#"+q.o[0]+"#"+(q.p||"").slice(0,12);
function markSeen(sid,lv,q){const k=sid+lv;const a=S.seen[k]=S.seen[k]||[];const x=qkey(q);if(!a.includes(x)){a.push(x);if(a.length>800)a.splice(0,a.length-800)}}
function bankInfo(s,lv){const b=(s.L[lv]||[]);const seen=new Set(S.seen[s.id+lv]||[]);const fresh=b.filter(x=>!seen.has(qkey(fromArr(x)))).length;return{total:b.length,fresh,gen:((s.G[lv]||[]).length>0)}}
function build(s,lv){
 const seen=new Set(S.seen[s.id+lv]||[]);const out=[],used=new Set();
 const add=q=>{if(!q||!q.o||q.o.length<2)return false;const k=qkey(q);if(used.has(k))return false;used.add(k);out.push(q);return true};
 const bank=shuffle(s.L[lv]||[]).map(fromArr);const gens=s.G[lv]||[];
 const fresh=bank.filter(q=>!seen.has(qkey(q)));
 const nb=gens.length?(s.id==="toan"?Math.min(3,fresh.length):Math.min(4,fresh.length)):fresh.length;
 fresh.slice(0,nb).forEach(add);
 let t=0;while(out.length<10&&gens.length&&t<300){t++;let q;try{q=pick(gens)()}catch(e){continue}if(!q)continue;if(seen.has(qkey(q))&&t<220)continue;add(q)}
 for(const q of bank){if(out.length>=10)break;add(q)}
 if(s.id==="toan"&&lv>1)out.forEach(q=>{if(q.ans&&Math.random()<.4)q.input=true});
 return shuffle(out.slice(0,10));
}

 const kk=root.querySelector("#keys");

 const mx=root.querySelector("#mix");
 if(mx){const C={Đỏ:"#E0302A",Vàng:"#F6C915",Lam:"#2360C9"},OUT={"Vàng+Đỏ":["#F2851F","Cam"],"Lam+Vàng":["#3BA646","Xanh lá"],"Lam+Đỏ":["#7B3AA8","Tím"]};let sel=[];
  const res=document.createElement("div"),lab=document.createElement("b");res.className="res";lab.textContent="Chọn 2 màu";
  Object.entries(C).forEach(([n,c])=>{const b=document.createElement("button");b.className="dot";b.style.background=c;b.setAttribute("aria-label",n);b.onclick=()=>{if(sel.includes(n))sel=sel.filter(x=>x!==n);else{sel.push(n);if(sel.length>2)sel.shift()}mx.querySelectorAll(".dot").forEach(d=>d.classList.toggle("sel",sel.includes(d.getAttribute("aria-label"))));if(sel.length===2){const o=OUT[sel.slice().sort().join("+")];res.style.background=o[0];lab.textContent=`${sel[0]} + ${sel[1]} = ${o[1]}`}else{res.style.background="transparent";lab.textContent="Chọn 2 màu"}};mx.appendChild(b)});

 const s=SUBJ.find(x=>x.id===id);location.hash=id;
 app.innerHTML=`<div class="head"><button class="btn sec" id="back">← Các môn</button><div class="badge" style="--h:${s.h}">${s.b}</div><div><h2>${s.name}</h2><p>${s.intro}</p></div></div>
 <div class="panel" style="--h:${s.h}"><div class="tabs" role="tablist"><button class="tab" role="tab" data-t="learn" aria-selected="${tab==="learn"}">Bài học</button><button class="tab" role="tab" data-t="quiz" aria-selected="${tab==="quiz"}">Luyện tập theo mức</button></div><div id="body"></div></div>`;
 $("#back").onclick=home;
 app.querySelectorAll(".tab").forEach(t=>t.onclick=()=>openSub(id,t.dataset.t));
 const body=$("#body");
 if(tab==="learn"){body.innerHTML=`<div class="lessons">${lessonsHTML(s)}</div><div class="qact" style="justify-content:flex-start;margin-top:16px"><button class="btn col" id="toq">Học xong, làm bài luyện tập →</button></div>`;wire(body);$("#toq").onclick=()=>openSub(id,"quiz")}
 else{
  body.innerHTML=`<p style="margin:0 0 12px;color:var(--muted);max-width:68ch">${S.requireMastery?"Đạt từ <b>8/10</b> ở một mức thì mức tiếp theo được mở.":"Con có thể chọn bất kì mức nào. Nên đạt từ <b>8/10</b> ở mức trước rồi hãy lên mức sau."} Câu làm sai sẽ tự vào Hộp ôn tập.</p><div class="levels">${[1,2,3].map(l=>{const op=unlocked(id,l),r=lvRec(id,l);return`<div class="lvl ${op?"open":"lock"}"><h3><span class="num">${l}</span>${LVN[l].split(" · ")[1]}</h3><p>${LVD[l]}</p>${mini(r?r.stars:0)}<p>${r?`Cao nhất: ${r.best}/${r.total}`:"Chưa làm"}</p><p style="font-size:.85rem">${(()=>{const b=bankInfo(s,l);return (b.gen?"Câu tự sinh: không giới hạn":"")+(b.total?`${b.gen?" · ":""}Câu mẫu mới: ${b.fresh}/${b.total}`:"")})()}</p><button class="btn ${op?"col":"sec"}" data-l="${l}" ${op?"":"disabled"}>${op?(r?"Làm lại":"Bắt đầu"):"Cần 8/10 ở Mức "+(l-1)}</button></div>`}).join("")}</div>`;
  body.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const lv=+b.dataset.l;runQuiz(build(s,lv),{mode:"lv",sid:id,lv,title:`${s.name} · ${LVN[lv]}`,h:s.h})});
 }

function review(){const items=shuffle(dueItems()).slice(0,15);runQuiz(items.map(it=>Object.assign({},it.q,{_it:it,sid:it.s})),{mode:"review",title:"Hộp ôn tập",h:25})}

const GOOD=["Đúng rồi!","Giỏi quá!","Chính xác!","Tuyệt vời!","Con làm rất tốt!"];
const GROW=["Chưa đúng, nhưng não con vừa học thêm được một điều.","Sai là một phần của học tập. Đọc lời giải nhé!","Gần đúng rồi, xem lại cách làm dưới đây."];
function norm(v){return String(v).replace(/[\s. ,]/g,"").replace(/[^\d]/g,"")}

function runQuiz(qs,cfg){
 app.innerHTML=`<div class="head"><button class="btn sec" id="back">← Thoát</button><div><h2>${cfg.title}</h2><p>${cfg.mode==="review"?"Trả lời đúng thì câu lên hộp cao hơn và lâu hơn mới gặp lại.":"Đọc kĩ, suy nghĩ rồi mới chọn. Có thể bấm “Gợi ý” nếu cần."}</p></div></div><div class="panel" style="--h:${cfg.h}"><div id="body"></div></div>`;
 $("#back").onclick=()=>cfg.sid?openSub(cfg.sid,"quiz"):home();
 const host=$("#body");let i=0,score=0,hints=0;
 const render=()=>{
  const q=qs[i];q.o2=q.o2||shuffle(q.o);
  host.innerHTML=`<div class="quiz"><div class="qtop"><span>Câu ${i+1} / ${qs.length}</span>${q.sid&&cfg.mode!=="lv"?`<span>${SUBJ.find(s=>s.id===q.sid).name}</span>`:""}<span>Đúng: ${score}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  ${q.p?`<div class="passage">${q.p}${/^[A-Z]/.test(q.p)?` <button class="say" id="sayp">nghe</button>`:""}</div>`:""}
  <p class="q">${q.q}${q.say?` <button class="say" id="sayq">nghe</button>`:""}</p>
  ${q.input?`<form class="inrow" id="inf"><input id="ans" inputmode="numeric" autocomplete="off" placeholder="Nhập đáp số" aria-label="Đáp số"><button class="btn col" type="submit">Kiểm tra</button></form><p style="color:var(--muted);margin:.5em 0 0;font-size:.9rem">Tự nghĩ và gõ đáp số${q.unit?` (đơn vị:${q.unit})`:""}.</p>`
   :`<div class="opts">${q.o2.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`}
  ${q.h?`<div class="qact" style="justify-content:flex-start"><button class="btn sec" id="hbtn">Gợi ý</button></div><div id="hint"></div>`:""}
  <div id="fb"></div></div>`;
  if(q.say)$("#sayq").onclick=()=>speak(q.say);
  if($("#sayp"))$("#sayp").onclick=()=>speak(q.p);
  if(q.h)$("#hbtn").onclick=()=>{$("#hint").innerHTML=`<div class="hint">Gợi ý: ${q.h}</div>`;$("#hbtn").disabled=true;hints++};
  const done=right=>{
   if(right)score++;
   S.log[today()]=(S.log[today()]||0)+1;
   if(cfg.mode==="lv")markSeen(cfg.sid,cfg.lv,q);
   if(cfg.mode==="review")boxUpdate(q._it,right);else if(!right)boxAdd(q.sid||cfg.sid,q);
   save();
   const correct=q.input?q.o[0]:q.o[0];
   $("#fb").innerHTML=`<div class="fb ${right?"ok":"no"}"><strong>${right?pick(GOOD):pick(GROW)}</strong>${right?"":`Đáp án: <b>${correct}</b>. `}${q.e}${!right&&cfg.mode!=="review"?"<small>Câu này đã vào Hộp ôn tập, ngày mai con gặp lại nhé.</small>":""}</div><div class="qact"><button class="btn" id="next">${i+1<qs.length?"Câu tiếp theo →":"Xem kết quả"}</button></div>`;
   host.querySelector(".qtop span:last-child").textContent="Đúng: "+score;
   if($("#hbtn"))$("#hbtn").disabled=true;
   $("#next").focus();$("#next").onclick=()=>{i++;i<qs.length?render():end()};
  };
  if(q.input){const f=$("#inf");$("#ans").focus();f.onsubmit=e=>{e.preventDefault();const v=$("#ans").value;if(!v.trim())return;const ok=norm(v)===norm(q.ans);$("#ans").disabled=true;f.querySelector("button").disabled=true;$("#ans").style.borderColor=ok?"var(--good)":"var(--red)";done(ok)}}
  else host.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const right=q.o2[+b.dataset.k]===q.o[0];host.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const v=q.o2[+x.dataset.k];if(v===q.o[0])x.classList.add("ok");else if(x===b)x.classList.add("no")});done(right)});
 };
 const end=()=>{
  const st=starsFor(score,qs.length);let extra="";
  if(cfg.mode==="lv"){S.p[cfg.sid]=S.p[cfg.sid]||{};const wasOpen=unlocked(cfg.sid,cfg.lv+1);const prev=S.p[cfg.sid][cfg.lv];if(!prev||score>prev.best)S.p[cfg.sid][cfg.lv]={best:score,total:qs.length,stars:st};
   if(cfg.lv<3&&!wasOpen&&unlocked(cfg.sid,cfg.lv+1))extra=`<div class="unlock">Đã mở khóa ${LVN[cfg.lv+1]}!</div>`;
   else if(cfg.lv<3&&!unlocked(cfg.sid,cfg.lv+1))extra=`<p style="color:var(--muted)">Cần ${Math.ceil(qs.length*.8)}/${qs.length} để mở Mức ${cfg.lv+1}. Xem lại bài học rồi thử lại nhé.</p>`}
  if(cfg.mode==="all"){if(!S.all||score>S.all.best)S.all={best:score,total:qs.length,stars:st}}
  save();
  const msg=cfg.mode==="review"?`Con đã ôn ${qs.length} câu. Còn ${dueItems().length} câu cần ôn hôm nay.`:st===3?"Xuất sắc! Thành đã làm chủ phần này.":st===2?"Làm tốt lắm! Cố thêm chút nữa là 3 sao.":st===1?"Khá rồi! Xem lại bài học rồi làm lại nhé.":"Không sao cả. Mỗi lần làm lại là não con mạnh thêm!";
  host.innerHTML=`<div class="quiz end"><div class="big">${score}/${qs.length}</div>${cfg.mode==="review"?"":`<div class="st">${[0,1,2].map(k=>starSvg(k<st)).join("")}</div>`}<p style="font-weight:800;font-size:1.15rem">${msg}</p>${hints?`<p style="color:var(--muted)">Con đã dùng ${hints} gợi ý. Lần sau thử tự làm trước nhé.</p>`:""}${extra}
  <div class="qact" style="justify-content:center"><button class="btn" id="again">${cfg.mode==="review"?"Về trang chính":"Làm bài mới"}</button>${cfg.sid?`<button class="btn sec" id="learn">Xem lại bài học</button><button class="btn sec" id="lvls">Chọn mức</button>`:""}${cfg.mode!=="review"?`<button class="btn sec" id="h">Về trang chính</button>`:""}</div></div>`;
  $("#again").onclick=()=>{if(cfg.mode==="review")home();else if(cfg.mode==="all")runQuiz(buildAll(),cfg);else runQuiz(build(SUBJ.find(s=>s.id===cfg.sid),cfg.lv),cfg)};
  if(cfg.sid){$("#learn").onclick=()=>openSub(cfg.sid,"learn");$("#lvls").onclick=()=>openSub(cfg.sid,"quiz")}
  if($("#h"))$("#h").onclick=home;
 };
 render();scrollTo(0,0);
}

 app.innerHTML=`<div class="head"><button class="btn sec" id="back">← Trang chính</button><div><h2>Góc bố mẹ</h2><p>Theo dõi tiến độ và cách phần mềm dạy con</p></div></div>
 <div class="box" style="margin-bottom:14px"><h3>Kết quả theo môn và mức</h3><div class="tbl"><table class="ptable"><tr><th>Môn</th><th>Mức 1</th><th>Mức 2</th><th>Mức 3</th><th>Câu đang ôn</th></tr>
 ${SUBJ.map(s=>`<tr><td>${s.name}</td>${[1,2,3].map(l=>{const r=lvRec(s.id,l);const v=r?r.best/r.total:null;return`<td class="p ${cls(v)}">${r?`${r.best}/${r.total}`:unlocked(s.id,l)?"–":"khóa"}</td>`}).join("")}<td class="p">${wrongBy[s.id]||0}</td></tr>`).join("")}</table></div>

  <div class="box"><h3>Hộp ôn tập Leitner</h3><div class="tbl"><table><tr><th>Hộp</th><th>Số câu</th><th>Gặp lại sau</th></tr>${boxes.map((n,k)=>`<tr><td>Hộp ${k+1}</td><td>${n}</td><td>${GAP[k+1]} ngày</td></tr>`).join("")}<tr><td>Đã thuộc</td><td>${S.mastered}</td><td>–</td></tr></table></div><p>Câu sai vào Hộp 1. Mỗi lần ôn đúng, câu lên hộp cao hơn và cách lâu hơn mới gặp lại. Đúng ở Hộp 4 thì tính là đã thuộc.</p></div>
 </div>
 <h3 style="margin:22px 0 10px;font-size:1.4rem">Các phương pháp học được áp dụng</h3>

  <div><h4>Học làm chủ (Mastery Learning)</h4><p>Theo B. Bloom: đạt 8/10 ở một mức rồi mới lên mức sau, tránh học chồng lên lỗ hổng. Bật điều kiện này trong phần Cài đặt bên dưới nếu muốn bắt buộc.</p></div>

  <div><h4>Học xen kẽ</h4><p>Bài ôn tổng hợp trộn các môn và dạng bài, rèn khả năng nhận ra cần dùng kiến thức nào.</p></div>
  <div><h4>Ví dụ mẫu và gợi ý từng bước</h4><p>Bài nâng cao có ví dụ giải mẫu và nút Gợi ý, như người lớn đỡ một tay rồi buông dần.</p></div>
  <div><h4>Sơ đồ đoạn thẳng (mô hình thanh)</h4><p>Cách giải toán có lời văn bằng hình vẽ, dùng rộng rãi trong chương trình Toán Singapore.</p></div>

  <div><h4>Học tập trung ngắn</h4><p>Nút hẹn giờ 15 phút học, 5 phút nghỉ, hợp với khả năng tập trung của trẻ 8 tuổi.</p></div>
 </div>
 <div class="box" style="margin-top:14px"><h3>Cài đặt</h3>

}
